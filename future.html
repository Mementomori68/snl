<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>??? — I want to be forever young</title>
    <link rel="icon" type="image/png" href="images/icon-192x192.png" />
    <link rel="apple-touch-icon" href="images/icon-512x512.png" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline' https://fonts.googleapis.com https://onesignal.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*; script-src 'self' 'unsafe-inline' https://cdn.onesignal.com https://api.onesignal.com https://cdn.jsdelivr.net; connect-src 'self' https://api.onesignal.com https://onesignal.com https://cdn.onesignal.com https://mwnanyuukoidlabekeft.supabase.co wss://mwnanyuukoidlabekeft.supabase.co; worker-src 'self' blob:;" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,600;9..144,800&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/snl/manifest.json" />

    <!-- OneSignal -->
    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "32bc1c1a-e834-48e6-ad0b-e46fcfa2a2c6",
          serviceWorkerParam: { scope: "/snl/" },
          serviceWorkerPath: "/snl/OneSignalSDKWorker.js",
        });
      });
    </script>

    <style>
        /* ================= ТЕМЫ ================= */
        :root {
            /* Светлая — пастель, кофе, лофт */
            --bg: #f7f1e8;
            --bg-sidebar: #fdf9f3;
            --bg-content: #f7f1e8;
            --bg-hover: #f0e6d8;
            --bg-active: #ffe8d6;
            --bg-input: #fdf9f3;
            --bg-bubble: #fdf9f3;
            --bg-card: #ffffff;
            --border: rgba(107, 79, 63, 0.12);
            --border-strong: rgba(107, 79, 63, 0.2);
            --text: #3a2e26;
            --text-muted: #8a7a6a;
            --text-secondary: #6b4f3f;
            --accent: #c97b5a;
            --accent-hover: #b36948;
            --accent-text: #ffffff;
            --accent-soft: #ffe8d6;
            --green: #6b8a5c;
            --yellow: #b88a3a;
            --shadow: 0 1px 2px rgba(107, 79, 63, 0.04), 0 8px 24px rgba(107, 79, 63, 0.06);
        }

        html.dark {
            /* Тёмная — вечернее кофе, тёплый полумрак */
            --bg: #1a1613;
            --bg-sidebar: #221d19;
            --bg-content: #1a1613;
            --bg-hover: #2a241f;
            --bg-active: #3a2c22;
            --bg-input: #2a241f;
            --bg-bubble: #2a241f;
            --bg-card: #221d19;
            --border: rgba(255, 220, 190, 0.08);
            --border-strong: rgba(255, 220, 190, 0.15);
            --text: #f0e6d8;
            --text-muted: #a89684;
            --text-secondary: #c9b8a6;
            --accent: #e8a184;
            --accent-hover: #f0b89a;
            --accent-text: #1a1613;
            --accent-soft: #3a2c22;
            --green: #a8b898;
            --yellow: #d8b878;
            --shadow: 0 1px 2px rgba(0, 0, 0, 0.3), 0 8px 24px rgba(0, 0, 0, 0.3);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        body {
            font-family: 'Inter', sans-serif;
            background: var(--bg);
            color: var(--text);
            height: 100vh;
            overflow: hidden;
            display: flex;
            transition: background 0.3s, color 0.3s;
        }

        /* ================= САЙДБАР ================= */
        .sidebar {
            width: 290px;
            background: var(--bg-sidebar);
            border-right: 1px solid var(--border);
            display: flex;
            flex-direction: column;
            transition: background 0.3s, border-color 0.3s;
            flex-shrink: 0;
        }

        .sidebar-header {
            padding: 1.4rem 1.3rem 1.2rem;
            border-bottom: 1px solid var(--border);
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .logo {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            font-family: 'Fraunces', serif;
            font-weight: 800;
            font-size: 1.15rem;
            letter-spacing: -0.02em;
            color: var(--text);
        }

        .logo-icon {
            width: 36px;
            height: 36px;
            border-radius: 11px;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-text);
            font-size: 1.1rem;
            font-weight: 800;
            font-family: 'Fraunces', serif;
            box-shadow: 0 4px 12px rgba(201, 123, 90, 0.25);
        }

        .theme-toggle {
            background: var(--bg-hover);
            border: 1px solid var(--border);
            color: var(--text-secondary);
            font-size: 1rem;
            cursor: pointer;
            padding: 7px 11px;
            border-radius: 12px;
            transition: all 0.2s;
            line-height: 1;
        }
        .theme-toggle:hover {
            background: var(--accent-soft);
            border-color: var(--accent);
            transform: rotate(15deg);
        }

        .sidebar-nav {
            padding: 0.8rem;
            flex: 1;
            display: flex;
            flex-direction: column;
            gap: 0.3rem;
        }

        .nav-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.8rem 1rem;
            border-radius: 14px;
            cursor: pointer;
            color: var(--text-secondary);
            font-weight: 500;
            font-size: 0.95rem;
            transition: all 0.2s;
            border: 1px solid transparent;
            background: none;
            width: 100%;
            text-align: left;
            font-family: inherit;
        }

        .nav-item:hover {
            background: var(--bg-hover);
            color: var(--text);
        }

        .nav-item.active {
            background: var(--accent-soft);
            color: var(--accent);
            border-color: rgba(201, 123, 90, 0.25);
            font-weight: 600;
        }

        .nav-item .nav-icon {
            font-size: 1.15rem;
            width: 22px;
            text-align: center;
            flex-shrink: 0;
        }

        .sidebar-footer {
            padding: 0.8rem;
            border-top: 1px solid var(--border);
        }

        .user-card {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.7rem;
            border-radius: 14px;
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid transparent;
        }
        .user-card:hover {
            background: var(--bg-hover);
            border-color: var(--border);
        }

        .user-avatar {
            width: 38px;
            height: 38px;
            border-radius: 12px;
            background: linear-gradient(135deg, var(--accent), var(--accent-hover));
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--accent-text);
            font-weight: 700;
            font-size: 0.95rem;
            flex-shrink: 0;
            font-family: 'Fraunces', serif;
            box-shadow: 0 3px 10px rgba(201, 123, 90, 0.2);
        }

        .user-info { flex: 1; min-width: 0; }
        .user-name {
            font-size: 0.9rem;
            font-weight: 600;
            color: var(--text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .user-sub {
            font-size: 0.75rem;
            color: var(--text-muted);
            margin-top: 1px;
        }

        /* ================= КОНТЕНТ ================= */
        .content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background: var(--bg-content);
            transition: background 0.3s;
            overflow: hidden;
        }

        .content-header {
            padding: 1.5rem 2rem 1.2rem;
            border-bottom: 1px solid var(--border);
            background: var(--bg-content);
        }

        .content-title {
            font-family: 'Fraunces', serif;
            font-size: 1.6rem;
            font-weight: 700;
            letter-spacing: -0.02em;
            color: var(--text);
        }

        .content-sub {
            font-size: 0.85rem;
            color: var(--text-muted);
            margin-top: 3px;
            letter-spacing: 0.5px;
        }

        .content-body {
            flex: 1;
            overflow-y: auto;
            padding: 1.8rem 2rem;
            scroll-behavior: smooth;
        }

        .content-body::-webkit-scrollbar { width: 8px; }
        .content-body::-webkit-scrollbar-track { background: transparent; }
        .content-body::-webkit-scrollbar-thumb {
            background: var(--border-strong);
            border-radius: 4px;
        }
        .content-body::-webkit-scrollbar-thumb:hover {
            background: var(--accent);
        }

        /* ================= ПОСТЫ ================= */
        .post {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 1.6rem 1.8rem;
            margin-bottom: 1.2rem;
            transition: all 0.3s;
            box-shadow: var(--shadow);
        }
        .post:hover {
            border-color: rgba(201, 123, 90, 0.3);
            transform: translateY(-2px);
        }

        .post h3 {
            font-family: 'Fraunces', serif;
            font-size: 1.35rem;
            font-weight: 700;
            margin-bottom: 0.4rem;
            letter-spacing: -0.01em;
            color: var(--text);
            line-height: 1.3;
        }

        .post .date {
            font-size: 0.75rem;
            color: var(--text-muted);
            display: block;
            margin-bottom: 0.9rem;
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .post img {
            max-width: 100%;
            border-radius: 16px;
            margin: 0.8rem 0;
            display: block;
            filter: saturate(0.95);
        }

        .post .text {
            color: var(--text-secondary);
            font-size: 1rem;
            line-height: 1.7;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .state-msg {
            text-align: center;
            color: var(--text-muted);
            padding: 4rem 1rem;
            font-size: 0.95rem;
        }

        /* ================= КОММЕНТАРИИ ================= */
        .comments-section {
            margin-top: 1.4rem;
            padding-top: 1.4rem;
            border-top: 1px dashed var(--border-strong);
        }
        .comments-title {
            color: var(--text-muted);
            font-size: 0.72rem;
            text-transform: uppercase;
            letter-spacing: 2px;
            margin-bottom: 1rem;
            font-weight: 600;
        }
        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
            margin-bottom: 1rem;
        }
        .comment {
            background: var(--bg-bubble);
            padding: 0.85rem 1rem;
            border-radius: 14px;
            border-left: 3px solid var(--accent);
        }
        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.35rem;
            font-size: 0.82rem;
            gap: 0.5rem;
        }
        .comment-author {
            color: var(--accent);
            font-weight: 600;
        }
        .comment-date {
            color: var(--text-muted);
            font-size: 0.72rem;
        }
        .comment-text {
            color: var(--text-secondary);
            font-size: 0.92rem;
            line-height: 1.55;
        }
        .comment-delete {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 0.72rem;
            margin-left: 6px;
            font-family: inherit;
        }
        .comment-delete:hover { color: #d96666; }

        .comment-form {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        .comment-form textarea {
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 14px;
            padding: 12px 16px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.92rem;
            resize: vertical;
            min-height: 60px;
            transition: border-color 0.2s, background 0.2s;
        }
        .comment-form textarea:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg-card);
        }
        .comment-form button {
            align-self: flex-end;
            background: var(--accent);
            color: var(--accent-text);
            border: none;
            padding: 10px 22px;
            border-radius: 22px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.88rem;
            transition: all 0.2s;
            box-shadow: 0 3px 10px rgba(201, 123, 90, 0.2);
        }
        .comment-form button:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
            box-shadow: 0 5px 14px rgba(201, 123, 90, 0.3);
        }
        .comment-form button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }
        .comment-login-msg {
            color: var(--text-muted);
            font-size: 0.85rem;
            font-style: italic;
            padding: 0.9rem;
            text-align: center;
            border: 1px dashed var(--border-strong);
            border-radius: 14px;
            background: var(--bg-bubble);
        }
        .comment-login-msg a {
            color: var(--accent);
            text-decoration: none;
            font-style: normal;
            font-weight: 600;
        }
        .comment-login-msg a:hover { text-decoration: underline; }

        /* ================= СООБЩЕНИЯ ================= */
        .messages-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            text-align: center;
            color: var(--text-muted);
            padding: 2rem;
        }
        .messages-empty .big-icon {
            font-size: 4rem;
            margin-bottom: 1.2rem;
            opacity: 0.5;
            filter: grayscale(0.3);
        }
        .messages-empty h3 {
            font-family: 'Fraunces', serif;
            color: var(--text);
            font-size: 1.4rem;
            margin-bottom: 0.6rem;
            font-weight: 700;
        }
        .messages-empty p {
            font-size: 0.95rem;
            max-width: 360px;
            line-height: 1.65;
        }

        /* ================= МОДАЛЬНОЕ ОКНО ================= */
        #auth-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(58, 46, 38, 0.4);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(8px);
            padding: 1rem;
        }
        .auth-modal-content {
            background: var(--bg-card);
            border: 1px solid var(--border);
            border-radius: 22px;
            padding: 2rem;
            width: 100%;
            max-width: 400px;
            position: relative;
            box-shadow: 0 12px 48px rgba(107, 79, 63, 0.2);
        }
        .auth-modal-content h2 {
            font-family: 'Fraunces', serif;
            color: var(--text);
            margin-bottom: 1.4rem;
            font-size: 1.6rem;
            text-align: center;
            font-weight: 700;
        }
        .auth-modal-close {
            position: absolute;
            top: 12px;
            right: 16px;
            background: none;
            border: none;
            color: var(--text-muted);
            font-size: 1.6rem;
            cursor: pointer;
            line-height: 1;
            transition: color 0.2s;
        }
        .auth-modal-close:hover { color: var(--accent); }
        .auth-form input {
            width: 100%;
            padding: 12px 16px;
            margin-bottom: 0.8rem;
            background: var(--bg-input);
            border: 1px solid var(--border);
            border-radius: 14px;
            color: var(--text);
            font-family: inherit;
            font-size: 0.95rem;
            transition: border-color 0.2s, background 0.2s;
        }
        .auth-form input:focus {
            outline: none;
            border-color: var(--accent);
            background: var(--bg-card);
        }
        .auth-form button {
            width: 100%;
            padding: 12px;
            background: var(--accent);
            color: var(--accent-text);
            border: none;
            border-radius: 14px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: 1rem;
            transition: all 0.2s;
            margin-top: 0.3rem;
            box-shadow: 0 3px 10px rgba(201, 123, 90, 0.2);
        }
        .auth-form button:hover {
            background: var(--accent-hover);
            transform: translateY(-1px);
        }
        .auth-form button:disabled { opacity: 0.5; transform: none; }
        .auth-switch {
            text-align: center;
            margin-top: 1rem;
            color: var(--accent);
            cursor: pointer;
            font-size: 0.88rem;
            background: none;
            border: none;
            font-family: inherit;
            width: 100%;
            font-weight: 500;
        }
        .auth-switch:hover { text-decoration: underline; }
        .auth-error {
            color: #d96666;
            font-size: 0.82rem;
            margin-bottom: 0.7rem;
            text-align: center;
            min-height: 1.1em;
        }

        /* ================= АДАПТИВ ================= */
        @media (max-width: 720px) {
            body { flex-direction: column; }
            .sidebar {
                width: 100%;
                border-right: none;
                border-bottom: 1px solid var(--border);
                flex-direction: row;
                align-items: center;
            }
            .sidebar-header {
                border-bottom: none;
                padding: 0.8rem 1rem;
                flex-shrink: 0;
            }
            .logo span { display: none; }
            .sidebar-nav {
                display: flex;
                padding: 0.5rem;
                gap: 0.3rem;
                flex: 1;
                flex-direction: row;
                overflow-x: auto;
            }
            .nav-item {
                padding: 0.55rem 0.9rem;
                font-size: 0.85rem;
                white-space: nowrap;
                border-radius: 12px;
            }
            .sidebar-footer { display: none; }
            .content-header { padding: 1.2rem 1.2rem 1rem; }
            .content-title { font-size: 1.3rem; }
            .content-body { padding: 1.2rem; }
            .post { padding: 1.2rem 1.3rem; border-radius: 18px; }
            .post h3 { font-size: 1.15rem; }
        }
    </style>
</head>
<body>

    <!-- ================= САЙДБАР ================= -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo">
                <div class="logo-icon">?</div>
                <span>Forever Young</span>
            </div>
            <button class="theme-toggle" onclick="toggleTheme()" id="theme-btn" title="Сменить тему">🌙</button>
        </div>

        <nav class="sidebar-nav">
            <button class="nav-item active" data-tab="channel" onclick="switchTab('channel')">
                <span class="nav-icon">📔</span>
                <span class="nav-label">Канал</span>
            </button>
            <button class="nav-item" data-tab="messages" onclick="switchTab('messages')">
                <span class="nav-icon">☕</span>
                <span class="nav-label">Сообщения</span>
            </button>
        </nav>

        <div class="sidebar-footer">
            <div class="user-card" id="user-card" onclick="handleUserClick()">
                <div class="user-avatar" id="user-avatar">?</div>
                <div class="user-info">
                    <div class="user-name" id="user-name">Гость</div>
                    <div class="user-sub" id="user-sub">нажмите, чтобы войти</div>
                </div>
            </div>
        </div>
    </aside>

    <!-- ================= КОНТЕНТ ================= -->
    <main class="content">
        <div class="content-header">
            <div class="content-title" id="content-title">Канал</div>
            <div class="content-sub" id="content-sub">Посты из третьего проекта</div>
        </div>

        <div class="content-body" id="content-body">
            <div class="posts" id="posts-container">
                <p class="state-msg">Загрузка...</p>
            </div>
        </div>
    </main>

    <!-- ================= МОДАЛЬНОЕ ОКНО ================= -->
    <div id="auth-modal">
        <div class="auth-modal-content">
            <button class="auth-modal-close" onclick="closeAuthModal()">×</button>
            <h2 id="auth-title">Вход</h2>
            <form class="auth-form" onsubmit="handleAuthSubmit(event)">
                <input type="hidden" id="auth-mode" value="login" />
                <div id="auth-username-row" style="display:none;">
                    <input type="text" id="auth-username" placeholder="Ваше имя" maxlength="30" />
                </div>
                <input type="email" id="auth-email" placeholder="Email" required />
                <input type="password" id="auth-password" placeholder="Пароль" required minlength="6" />
                <div class="auth-error" id="auth-error"></div>
                <button type="submit" id="auth-submit">Войти</button>
            </form>
            <button class="auth-switch" id="auth-switch" onclick="switchAuthMode()">
                Нет аккаунта? Зарегистрироваться
            </button>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="auth.js"></script>

    <script>
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            const div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }

        // ============ ТЕМА ============
        function applyTheme(theme) {
            if (theme === 'dark') {
                document.documentElement.classList.add('dark');
                document.getElementById('theme-btn').textContent = '☀️';
            } else {
                document.documentElement.classList.remove('dark');
                document.getElementById('theme-btn').textContent = '🌙';
            }
        }

        function toggleTheme() {
            const isDark = document.documentElement.classList.contains('dark');
            const newTheme = isDark ? 'light' : 'dark';
            localStorage.setItem('theme', newTheme);
            applyTheme(newTheme);
        }

        (function initTheme() {
            const saved = localStorage.getItem('theme');
            const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
            applyTheme(saved || (prefersDark ? 'dark' : 'light'));
        })();

        // ============ ВКЛАДКИ ============
        function switchTab(tab) {
            document.querySelectorAll('.nav-item').forEach(el => {
                el.classList.toggle('active', el.dataset.tab === tab);
            });

            const body = document.getElementById('content-body');
            const titleEl = document.getElementById('content-title');
            const subEl = document.getElementById('content-sub');

            if (tab === 'channel') {
                titleEl.textContent = 'Канал';
                subEl.textContent = 'Посты из третьего проекта';
                body.innerHTML = '<div class="posts" id="posts-container"><p class="state-msg">Загрузка...</p></div>';
                loadPosts();
            } else if (tab === 'messages') {
                titleEl.textContent = 'Сообщения';
                subEl.textContent = 'Личные переписки';
                body.innerHTML = `
                    <div class="messages-empty">
                        <div class="big-icon">☕</div>
                        <h3>Скоро здесь будет тепло</h3>
                        <p>Мы варим для тебя систему личных сообщений. Пока налей себе кофе и заглядывай позже.</p>
                    </div>
                `;
            }
        }

        // ============ ПОСТЫ ============
        async function loadPosts() {
            const container = document.getElementById('posts-container');
            if (!container) return;

            container.innerHTML = '<p class="state-msg">Загрузка...</p>';

            try {
                const { data, error } = await db
                    .from('posts')
                    .select('*')
                    .order('date', { ascending: false });

                if (error) throw error;

                container.innerHTML = '';

                if (!data || data.length === 0) {
                    container.innerHTML = '<p class="state-msg">Пока нет постов. Скоро появятся.</p>';
                    return;
                }

                data.forEach(post => {
                    const div = document.createElement('div');
                    div.className = 'post';
                    div.innerHTML = `
                        <h3>${escapeHtml(post.title)}</h3>
                        <span class="date">${escapeHtml(post.date || '')}</span>
                        ${post.image_url ? `<img src="${escapeHtml(post.image_url)}" alt="${escapeHtml(post.title)}" loading="lazy" />` : ''}
                        <div class="text">${escapeHtml(post.text)}</div>
                        <div class="comments-section">
                            <div class="comments-title">Комментарии</div>
                            <div class="comments-list" id="comments-${post.id}">
                                <p class="state-msg">Загрузка...</p>
                            </div>
                            <div id="comment-form-${post.id}"></div>
                        </div>
                    `;
                    container.appendChild(div);
                });

                data.forEach(post => loadCommentsForPost(post.id));

            } catch (err) {
                console.error('Ошибка загрузки постов:', err);
                container.innerHTML = '<p class="state-msg">Не удалось загрузить посты.</p>';
            }
        }

        // ============ КОММЕНТАРИИ ============
        async function loadCommentsForPost(postId) {
            const list = document.getElementById(`comments-${postId}`);
            if (!list) return;

            const { data, error } = await db
                .from('comments')
                .select('*')
                .eq('post_id', postId)
                .order('created_at', { ascending: true });

            if (error) {
                list.innerHTML = '<p class="state-msg">Ошибка загрузки</p>';
                return;
            }

            if (!data || data.length === 0) {
                list.innerHTML = '<p style="color:var(--text-muted); font-size:0.82rem; text-align:center; padding:0.4rem;">Пока нет комментариев — будь первым ☕</p>';
            } else {
                list.innerHTML = data.map(c => renderComment(c)).join('');
            }

            renderCommentForm(postId);
        }

        function renderComment(c) {
            const isMine = currentUser && currentUser.id === c.user_id;
            const deleteBtn = isMine
                ? `<button class="comment-delete" onclick="deleteComment(${c.id}, ${c.post_id})">удалить</button>`
                : '';
            return `
                <div class="comment">
                    <div class="comment-header">
                        <span class="comment-author">${escapeHtml(c.author_name)}</span>
                        <span>
                            <span class="comment-date">${new Date(c.created_at).toLocaleString('ru-RU')}</span>
                            ${deleteBtn}
                        </span>
                    </div>
                    <div class="comment-text">${escapeHtml(c.text)}</div>
                </div>
            `;
        }

        function renderCommentForm(postId) {
            const formBox = document.getElementById(`comment-form-${postId}`);
            if (!formBox) return;

            if (!currentUser) {
                formBox.innerHTML = `
                    <p class="comment-login-msg">
                        <a href="#" onclick="openAuthModal(); return false;">Войдите</a>, чтобы оставить комментарий
                    </p>
                `;
                return;
            }

            formBox.innerHTML = `
                <form class="comment-form" onsubmit="submitComment(event, ${postId})">
                    <textarea id="comment-text-${postId}" placeholder="Напишите что-нибудь тёплое..." maxlength="500" required></textarea>
                    <button type="submit" id="comment-btn-${postId}">Отправить</button>
                </form>
            `;
        }

        async function submitComment(event, postId) {
            event.preventDefault();
            const textarea = document.getElementById(`comment-text-${postId}`);
            const btn = document.getElementById(`comment-btn-${postId}`);
            const text = textarea.value.trim();
            if (!text) return;

            btn.disabled = true;
            btn.textContent = 'Отправка...';

            try {
                const { error } = await db.from('comments').insert({
                    post_id: postId,
                    user_id: currentUser.id,
                    author_name: currentProfile?.username || currentUser.email.split('@')[0],
                    text: text
                });
                if (error) throw error;
                textarea.value = '';
                await loadCommentsForPost(postId);
            } catch (err) {
                alert('Ошибка: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Отправить';
            }
        }

        async function deleteComment(commentId, postId) {
            if (!confirm('Удалить комментарий?')) return;
            const { error } = await db.from('comments').delete().eq('id', commentId);
            if (error) { alert('Ошибка: ' + error.message); return; }
            await loadCommentsForPost(postId);
        }

        function handleUserClick() {
            if (currentUser) {
                if (confirm('Выйти из аккаунта?')) logout();
            } else {
                openAuthModal();
            }
        }

        // Обновление UI профиля
        const originalUpdateAuthUI = window.updateAuthUI;
        window.updateAuthUI = function() {
            if (originalUpdateAuthUI) originalUpdateAuthUI();

            const nameEl = document.getElementById('user-name');
            const subEl = document.getElementById('user-sub');
            const avatarEl = document.getElementById('user-avatar');

            if (currentUser) {
                const name = currentProfile?.username || currentUser.email.split('@')[0];
                nameEl.textContent = name;
                subEl.textContent = 'нажмите, чтобы выйти';
                avatarEl.textContent = name.charAt(0).toUpperCase();
            } else {
                nameEl.textContent = 'Гость';
                subEl.textContent = 'нажмите, чтобы войти';
                avatarEl.textContent = '?';
            }
        };

        loadPosts();
    </script>

</body>
</html>
