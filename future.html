      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "32bc1c1a-e834-48e6-ad0b-e46fcfa2a2c6",

          serviceWorkerPath: "/snl/OneSignalSDKWorker.js",
        });
      });
    </script>

    <style>
        :root {
            --sky: #0a0a0f;
            --bg-gradient: radial-gradient(ellipse at 20% 0%, rgba(40, 40, 50, 0.5) 0%, transparent 55%),
                           radial-gradient(ellipse at 80% 30%, rgba(30, 30, 40, 0.4) 0%, transparent 55%),
                           linear-gradient(180deg, #0a0a0f 0%, #0f0f14 60%, #14141a 100%);
            --ink: #f5f0e6;
            --ink-soft: #c8c2b8;
            --dim: #6b6b6b;
            --dim-soft: #3a3a3a;
            --line: rgba(245, 240, 230, 0.08);
            --line-strong: rgba(245, 240, 230, 0.18);
            --post-bg: rgba(255, 255, 255, 0.025);
            --post-bg-hover: rgba(255, 255, 255, 0.04);
            --post-border: rgba(255, 255, 255, 0.06);
            --post-border-hover: rgba(255, 255, 255, 0.14);
            --post-text: #f5f0e6;
            --post-text-soft: #c8c2b8;
            --post-dim: #6b6b6b;
            --post-input-bg: rgba(255, 255, 255, 0.02);
            --post-input-bg-focus: rgba(255, 255, 255, 0.04);
            --btn-ink: #0a0a0f;
            --topbar-bg: rgba(10, 10, 15, 0.8);
            --badge-bg: rgba(10, 10, 15, 0.85);
            --avatar-bg: linear-gradient(135deg, rgba(245, 240, 230, 0.18), rgba(245, 240, 230, 0.05));
            --avatar-border: rgba(245, 240, 230, 0.15);
            --stars-visible: block;
        }

        html.light {
            --sky: #fafaf7;
            --bg-gradient: none;
            --ink: #1a1a1a;
            --ink-soft: #3a3a3a;
            --dim: #8a8a8a;
            --dim-soft: #c8c8c8;
            --line: rgba(26, 26, 26, 0.08);
            --line-strong: rgba(26, 26, 26, 0.18);
            --post-bg: #0e1a2b;
            --post-bg-hover: #142138;
            --post-border: rgba(140, 170, 210, 0.1);
            --post-border-hover: rgba(140, 170, 210, 0.25);
            --post-text: #f5f0e6;
            --post-text-soft: #b8c2d4;
            --post-dim: #6b7a94;
            --post-input-bg: rgba(255, 255, 255, 0.04);
            --post-input-bg-focus: rgba(255, 255, 255, 0.07);
            --btn-ink: #0a0a0f;
            --topbar-bg: rgba(250, 250, 247, 0.9);
            --badge-bg: rgba(250, 250, 247, 0.95);
            --avatar-bg: linear-gradient(135deg, rgba(26, 26, 26, 0.08), rgba(26, 26, 26, 0.03));
            --avatar-border: rgba(26, 26, 26, 0.1);
            --stars-visible: none;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }
        html, body { min-height: 100%; }

        body {
            background: var(--sky);
            color: var(--ink);
            font-family: 'DM Sans', -apple-system, BlinkMacSystemFont, sans-serif;
            font-weight: 400;
            letter-spacing: -0.005em;
            line-height: 1.55;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            position: relative;
            transition: background 0.4s ease, color 0.4s ease;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            background-image: var(--bg-gradient);
            z-index: -1;
            pointer-events: none;
        }

        .starfield {
            position: fixed; inset: 0; z-index: 0;
            pointer-events: none; overflow: hidden;
            display: var(--stars-visible);
            animation: drift 180s linear infinite alternate;
        }
        .star { position: absolute; border-radius: 50%; background: #ffffff; }
        .star.s-1 { box-shadow: 0 0 1px rgba(255,255,255,0.6); }
        .star.s-2 { box-shadow: 0 0 3px rgba(255,255,255,0.9), 0 0 6px rgba(220,220,220,0.4); }
        .star.s-3 { box-shadow: 0 0 4px rgba(255,255,255,1), 0 0 10px rgba(220,220,220,0.7), 0 0 20px rgba(200,200,200,0.3); }
        .star.s-4 { box-shadow: 0 0 6px rgba(255,255,255,1), 0 0 14px rgba(220,220,220,0.8), 0 0 28px rgba(200,200,200,0.5), 0 0 48px rgba(200,200,200,0.2); }
        @keyframes tw-slow { 0%,100% { opacity: 0.35; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1); } }
        @keyframes tw-mid  { 0%,100% { opacity: 0.5; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1); } }
        @keyframes tw-fast { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }
        .star.t-1 { animation: tw-slow 6s ease-in-out infinite; }
        .star.t-2 { animation: tw-mid 3.5s ease-in-out infinite; }
        .star.t-3 { animation: tw-fast 2s ease-in-out infinite; }
        @keyframes drift { 0% { transform: translate(0, 0); } 100% { transform: translate(-30px, -50px); } }

        @media (max-width: 800px) {
            .starfield { animation: none; }
            .star.s-1 { box-shadow: none; }
            .star.s-2 { box-shadow: 0 0 2px rgba(255,255,255,0.6); }
            .star.s-3 { box-shadow: 0 0 3px rgba(255,255,255,0.7); }
            .star.s-4 { box-shadow: 0 0 4px rgba(255,255,255,0.8); }
        }

        .page {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 4rem;
        }

        .top-bar {
            background: var(--topbar-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            color: var(--ink-soft);
            text-align: center;
            padding: calc(0.8rem + env(safe-area-inset-top, 0)) 1rem 0.8rem;
            font-size: 0.72rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-weight: 500;
            border-bottom: 1px solid var(--line);
            position: relative;
            z-index: 3;
        }
        .top-bar a { color: var(--ink-soft); text-decoration: none; transition: color 0.3s; }
        .top-bar a:hover { color: var(--ink); }
        .top-bar .sep { display: inline-block; margin: 0 1rem; opacity: 0.4; }

        .corner-controls {
            position: absolute;
            top: calc(60px + env(safe-area-inset-top, 0));
            right: 24px;
            z-index: 5;
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .theme-toggle {
            padding: 0.55rem 1.1rem;
            border-radius: 20px;
            background: var(--badge-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--line);
            color: var(--ink-soft);
            cursor: pointer;
            font-size: 0.68rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            font-family: inherit;
        }
        .theme-toggle:hover { border-color: var(--line-strong); color: var(--ink); }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.5rem 1rem 0.5rem 0.5rem;
            background: var(--badge-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--line);
            border-radius: 30px;
            font-size: 0.8rem;
            color: var(--ink-soft);
            cursor: pointer;
            transition: all 0.3s;
        }
        .user-badge:hover { border-color: var(--line-strong); }
        .user-badge .avatar {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: var(--avatar-bg);
            border: 1px solid var(--avatar-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink);
            font-weight: 500;
            font-size: 0.75rem;
        }
        .user-badge .name {
            max-width: 120px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .hero {
            max-width: 1000px;
            margin: 0 auto;
            padding: 5rem 2rem 3rem;
            text-align: center;
            position: relative;
            z-index: 5;
            width: 100%;
        }
        .hero h1 {
            font-size: clamp(4rem, 14vw, 10rem);
            font-weight: 300;
            line-height: 1;
            letter-spacing: -0.06em;
            margin-bottom: 1.5rem;
            color: var(--ink);
        }
        html:not(.light) .hero h1 { text-shadow: 0 0 80px rgba(245, 240, 230, 0.2); }
        .hero h1 em { font-style: normal; font-weight: 700; letter-spacing: -0.07em; }
        .hero .sub {
            font-size: 1rem;
            color: var(--dim);
            line-height: 1.7;
            max-width: 560px;
            margin: 0 auto;
        }

        .tabs {
            max-width: 1400px;
            margin: 3rem auto 0;
            padding: 0 2.5rem;
            display: flex;
            gap: 2.5rem;
            border-bottom: 1px solid var(--line);
            width: 100%;
            position: relative;
            z-index: 5;
        }
        .tab {
            background: none; border: none;
            color: var(--dim);
            font-family: inherit;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            padding: 1.2rem 0;
            cursor: pointer;
            position: relative;
            transition: color 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
        }
        .tab::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 0; right: 0;
            height: 1px;
            background: var(--ink);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1);
        }
        .tab:hover { color: var(--ink-soft); }
        .tab.active { color: var(--ink); }
        .tab.active::after { transform: scaleX(1); }
        .tab .tab-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--dim-soft);
            transition: background 0.3s ease;
        }
        .tab.active .tab-dot { background: var(--ink); }

        .content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 3rem 2.5rem 5rem;
            flex: 1;
            width: 100%;
            position: relative;
            z-index: 5;
        }

        .admin-panel {
            max-width: 720px;
            margin: 0 auto 2rem;
            padding: 1.5rem;
            border: 1px dashed var(--post-border-hover);
            border-radius: 16px;
            background: var(--post-bg);
        }
        .admin-panel h3 {
            color: var(--post-text);
            font-size: 0.85rem;
            font-weight: 600;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            margin-bottom: 1rem;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }
        .admin-panel h3::before { content: '⚙'; font-size: 1rem; }

        .admin-form { display: flex; flex-direction: column; gap: 0.6rem; }
        .admin-form input,
        .admin-form textarea {
            background: var(--post-input-bg);
            border: 1px solid var(--post-border);
            border-radius: 10px;
            padding: 10px 14px;
            color: var(--post-text);
            font-family: inherit;
            font-size: 0.92rem;
        }
        .admin-form input:focus,
        .admin-form textarea:focus { outline: none; border-color: var(--post-border-hover); }
        .admin-form input::placeholder,
        .admin-form textarea::placeholder { color: var(--post-dim); }
        .admin-form textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
        .admin-form .row { display: grid; grid-template-columns: 1fr 1fr; gap: 0.6rem; }
        .admin-form button {
            align-self: flex-start;
            background: var(--post-text);
            color: var(--btn-ink);
            border: none;
            padding: 10px 24px;
            border-radius: 100px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 600;
            font-size: 0.75rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }
        .admin-form button:hover { opacity: 0.9; }
        .admin-form button:disabled { opacity: 0.5; cursor: not-allowed; }
        .admin-status { font-size: 0.82rem; color: var(--post-text-soft); min-height: 1.2em; margin-top: 0.3rem; }

        .post-delete-btn {
            position: absolute;
            top: 1rem;
            right: 1rem;
            background: var(--post-input-bg);
            border: 1px solid var(--post-border);
            color: var(--post-dim);
            width: 32px;
            height: 32px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 0.9rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            opacity: 0;
            transition: all 0.25s;
        }
        .post:hover .post-delete-btn { opacity: 1; }
        .post-delete-btn:hover { background: #d94848; border-color: #d94848; color: #fff; }

        .posts {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 720px;
            margin: 0 auto;
        }

        .post {
            padding: 1.8rem 2rem;
            border-radius: 20px;
            background: var(--post-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--post-border);
            transition: border-color 0.3s ease, transform 0.3s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.3s ease;
            position: relative;
        }
        .post:hover { border-color: var(--post-border-hover); transform: translateY(-2px); }
        html:not(.light) .post:hover { box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3); }
        html.light .post:hover { box-shadow: 0 20px 40px rgba(14, 26, 43, 0.25); }
        .post h3 {
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.3;
            margin-bottom: 0.4rem;
            color: var(--post-text);
        }
        .post .date {
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--post-dim);
            display: block;
            margin-bottom: 1.2rem;
            font-weight: 500;
        }
        .post img {
            max-width: 100%;
            border-radius: 12px;
            margin: 1rem 0;
            display: block;
            border: 1px solid var(--post-border);
        }
        .post .text {
            color: var(--post-text-soft);
            font-size: 0.98rem;
            line-height: 1.7;
            white-space: pre-wrap;
            word-wrap: break-word;
        }

        .comments-section {
            margin-top: 1.6rem;
            padding-top: 1.4rem;
            border-top: 1px solid var(--post-border);
        }
        .comments-title {
            color: var(--post-dim);
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            margin-bottom: 1rem;
            font-weight: 600;
        }
        .comments-list { display: flex; flex-direction: column; gap: 0.6rem; margin-bottom: 1rem; }
        .comment {
            padding: 0.8rem 1rem;
            border-radius: 12px;
            background: var(--post-input-bg);
            border: 1px solid var(--post-border);
        }
        .comment:hover { border-color: var(--post-border-hover); background: var(--post-input-bg-focus); }
        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.3rem;
            font-size: 0.82rem;
            gap: 0.5rem;
        }
        .comment-author { color: var(--post-text); font-weight: 600; }
        .comment-date { color: var(--post-dim); font-size: 0.7rem; }
        .comment-text { color: var(--post-text-soft); font-size: 0.92rem; line-height: 1.6; }
        .comment-delete {
            background: none; border: none;
            color: var(--post-dim);
            cursor: pointer;
            font-size: 0.7rem;
            margin-left: 8px;
            font-family: inherit;
        }
        .comment-delete:hover { color: var(--post-text); }

        .comment-form { display: flex; flex-direction: column; gap: 0.6rem; }
        .comment-form textarea {
            background: var(--post-input-bg);
            border: 1px solid var(--post-border);
            border-radius: 12px;
            padding: 11px 14px;
            color: var(--post-text);
            font-family: inherit;
            font-size: 0.92rem;
            resize: vertical;
            min-height: 52px;
            line-height: 1.5;
        }
        .comment-form textarea:focus { outline: none; border-color: var(--post-border-hover); background: var(--post-input-bg-focus); }
        .comment-form textarea::placeholder { color: var(--post-dim); }
        .comment-form button {
            align-self: flex-end;
            background: transparent;
            color: var(--post-text);
            border: 1px solid var(--post-border-hover);
            padding: 8px 20px;
            border-radius: 100px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            font-size: 0.72rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
        }
        .comment-form button:hover { background: var(--post-text); color: var(--btn-ink); border-color: var(--post-text); }
        .comment-form button:disabled { opacity: 0.4; cursor: not-allowed; }

        .comment-login-msg {
            color: var(--post-dim);
            font-size: 0.85rem;
            font-style: italic;
            padding: 1rem;
            text-align: center;
            border: 1px dashed var(--post-border-hover);
            border-radius: 12px;
        }
        .comment-login-msg a {
            color: var(--post-text);
            text-decoration: none;
            font-style: normal;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 1px dotted var(--post-border-hover);
        }

        .messenger {
            display: grid;
            grid-template-columns: 300px 1fr;
            background: var(--post-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--post-border);
            border-radius: 20px;
            overflow: hidden;
            height: 620px;
            max-width: 1100px;
            margin: 0 auto;
            position: relative;
        }

        .messenger.noauth {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .conversations {
            border-right: 1px solid var(--post-border);
            display: flex;
            flex-direction: column;
            background: var(--post-input-bg);
            min-height: 0;
        }
        .conversations-header {
            padding: 1.4rem 1.4rem 1.2rem;
            border-bottom: 1px solid var(--post-border);
            display: flex;
            align-items: flex-start;
            justify-content: space-between;
            gap: 0.8rem;
            flex-shrink: 0;
        }
        .conversations-header .header-text { flex: 1; min-width: 0; }
        .conversations-header .title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--post-text);
            margin-bottom: 0.3rem;
        }
        .conversations-header .subtitle {
            font-size: 0.68rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--post-dim);
        }
        .new-chat-btn {
            background: var(--post-input-bg);
            border: 1px solid var(--post-border);
            color: var(--post-text);
            width: 30px;
            height: 30px;
            border-radius: 50%;
            cursor: pointer;
            font-size: 1.1rem;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: inherit;
            line-height: 1;
            padding: 0;
            flex-shrink: 0;
            transition: all 0.25s;
        }
        .new-chat-btn:hover { background: var(--post-input-bg-focus); border-color: var(--post-border-hover); }
        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
            -webkit-overflow-scrolling: touch;
        }
        .conversations-list::-webkit-scrollbar { width: 4px; }
        .conversations-list::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 2px; }

        .conv-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.75rem 0.9rem;
            border-radius: 12px;
            cursor: pointer;
            border: 1px solid transparent;
            transition: background 0.2s;
        }
        .conv-item:hover { background: var(--post-input-bg-focus); }
        .conv-item.active {
            background: var(--post-input-bg-focus);
            border-color: var(--post-border-hover);
        }
        .conv-item .conv-avatar {
            width: 38px; height: 38px;
            border-radius: 50%;
            background: var(--post-input-bg-focus);
            border: 1px solid var(--post-border-hover);
            display: flex; align-items: center; justify-content: center;
            color: var(--post-text); font-weight: 500; font-size: 0.9rem;
            flex-shrink: 0;
        }
        .conv-item .conv-info { flex: 1; min-width: 0; }
        .conv-item .conv-name {
            font-size: 0.92rem;
            font-weight: 500;
            color: var(--post-text);
            white-space: nowrap;
            overflow: hidden;

    <script>
    (function() {
        'use strict';

        function applyTheme(theme) {
            const btn = document.getElementById('theme-toggle');
            if (theme === 'light') {
                document.documentElement.classList.add('light');
                if (btn) btn.textContent = 'Светлая';
            } else {
                document.documentElement.classList.remove('light');
                if (btn) btn.textContent = 'Тёмная';
            }
        }

        window.toggleTheme = function() {
            const isLight = document.documentElement.classList.contains('light');
            const newTheme = isLight ? 'dark' : 'light';
            localStorage.setItem('ify_theme', newTheme);
            applyTheme(newTheme);
        };

        (function initTheme() {
            const saved = localStorage.getItem('ify_theme');
            const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
            applyTheme(saved || (prefersLight ? 'light' : 'dark'));
        })();

        function createStarfield() {
            const field = document.createElement('div');
            field.className = 'starfield';
            const isMobile = window.innerWidth < 800;
            const count = isMobile ? 60 : 220;
            const configs = [
                { prob: 0.55, min: 0.5, max: 1.0, size: 's-1', speed: 't-1' },
                { prob: 0.20, min: 0.9, max: 1.4, size: 's-2', speed: 't-2' },
                { prob: 0.15, min: 1.1, max: 1.8, size: 's-2', speed: 't-2' },
                { prob: 0.07, min: 1.8, max: 2.4, size: 's-3', speed: 't-3' },
                { prob: 0.03, min: 2.4, max: 3.2, size: 's-4', speed: 't-1' }
            ];
            function pickConfig() {
                const r = Math.random(); let acc = 0;
                for (const c of configs) { acc += c.prob; if (r < acc) return c; }
                return configs[0];
            }
            for (let i = 0; i < count; i++) {
                const cfg = pickConfig();
                const star = document.createElement('div');
                star.className = 'star ' + cfg.size + ' ' + cfg.speed;
                const size = cfg.min + Math.random() * (cfg.max - cfg.min);
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = (Math.random() * 6) + 's';
                field.appendChild(star);
            }
            document.body.insertBefore(field, document.body.firstChild);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', createStarfield);
        } else { createStarfield(); }
    })();
    </script>

    <script>
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            const div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(el => {
                el.classList.toggle('active', el.dataset.tab === tab);
            });
            document.body.classList.toggle('mobile-messages', tab === 'messages');
            const content = document.getElementById('content');

            if (tab === 'channel') {
                content.innerHTML = '<div class="posts" id="posts-container"><p class="state-msg">Загрузка...</p></div>';
                loadPosts();
            } else if (tab === 'messages') {
                renderMessenger();
            }
        }

        // ================= ПОСТЫ =================
        async function loadPosts() {
            const container = document.getElementById('posts-container');
            if (!container) return;
            container.innerHTML = '<p class="state-msg">Загрузка...</p>';

            const isAdmin = !!(currentUser && currentUser.is_admin);

            try {
                const data = await api('/api/posts');

                container.innerHTML = '';

                if (isAdmin) {
                    const adminPanel = document.createElement('div');
                    adminPanel.className = 'admin-panel';
                    adminPanel.innerHTML = `
                        <h3>Новый пост</h3>
                        <form class="admin-form" onsubmit="createPost(event)">
                            <input type="text" id="new-post-title" placeholder="Заголовок" required maxlength="100" />
                            <div class="row">
                                <input type="date" id="new-post-date" />
                                <input type="url" id="new-post-image" placeholder="URL фото (необязательно)" />
                            </div>
                            <textarea id="new-post-text" placeholder="Текст поста..." required maxlength="5000"></textarea>
                            <button type="submit" id="create-post-btn">Опубликовать</button>
                            <div class="admin-status" id="admin-status"></div>
                        </form>
                    `;
                    container.appendChild(adminPanel);
                    const dateInput = document.getElementById('new-post-date');
                    if (dateInput) dateInput.value = new Date().toISOString().slice(0, 10);
                }

                if (!data || data.length === 0) {
                    const empty = document.createElement('p');
                    empty.className = 'state-msg';
                    empty.textContent = 'Пока нет постов. Скоро появятся.';
                    container.appendChild(empty);
                    return;
                }

                data.forEach(post => {
                    const div = document.createElement('div');
                    div.className = 'post';
                    div.dataset.postId = post.id;
                    div.innerHTML = `
                        ${isAdmin ? `<button class="post-delete-btn" onclick="deletePost(${post.id})" title="Удалить">×</button>` : ''}
                        <h3>${escapeHtml(post.title)}</h3>
                        <span class="date">${escapeHtml(post.date || '')}</span>
                        ${post.image_url ? `<img src="${escapeHtml(post.image_url)}" alt="${escapeHtml(post.title)}" loading="lazy" />` : ''}
                        <div class="text">${escapeHtml(post.text)}</div>
                        <div class="comments-section">
                            <div class="comments-title">Комментарии</div>
                            <div class="comments-list" id="comments-${post.id}">
                                <p class="state-msg">Загрузка...</p>
                            </div>
                            <div id="comment-form-${post.id}"></div>
                        </div>
                    `;
                    container.appendChild(div);
                });

                data.forEach(post => loadCommentsForPost(post.id));
            } catch (err) {
                console.error('Ошибка загрузки постов:', err);
                container.innerHTML = '<p class="state-msg error">Не удалось загрузить посты.</p>';
            }
        }

        async function createPost(event) {
            event.preventDefault();
            const btn = document.getElementById('create-post-btn');
            const status = document.getElementById('admin-status');
            const title = document.getElementById('new-post-title').value.trim();
            const text = document.getElementById('new-post-text').value.trim();
            const date = document.getElementById('new-post-date').value;
            const image = document.getElementById('new-post-image').value.trim();
            if (!title || !text) return;

            btn.disabled = true;
            btn.textContent = 'Публикация...';
            status.textContent = '';

            try {
                await api('/api/posts', {
                    method: 'POST',
                    body: {
                        title, text,
                        date: date || new Date().toISOString().slice(0, 10),
                        image_url: image || null
                    }
                });
                status.textContent = '✓ Пост опубликован';
                status.style.color = '#34d399';
                await loadPosts();
            } catch (err) {
                status.textContent = 'Ошибка: ' + err.message;
                status.style.color = '#d94848';
            } finally {
                btn.disabled = false;
                btn.textContent = 'Опубликовать';
            }
        }

        async function deletePost(postId) {
            if (!confirm('Удалить пост? Это действие нельзя отменить.')) return;
            try {
                await api('/api/posts/' + postId, { method: 'DELETE' });
                await loadPosts();
            } catch (err) { alert('Ошибка: ' + err.message); }
        }

        // ================= КОММЕНТАРИИ =================
        async function loadCommentsForPost(postId) {
            const list = document.getElementById(`comments-${postId}`);
            if (!list) return;
            try {
                const data = await api('/api/comments/' + postId);
                if (!data || data.length === 0) {
                    list.innerHTML = '<p style="color:var(--post-dim); font-size:0.85rem; text-align:center; padding:0.4rem;">Пока нет комментариев</p>';
                } else {
                    list.innerHTML = data.map(c => renderComment(c)).join('');
                }
                renderCommentForm(postId);
            } catch (err) {
                list.innerHTML = '<p class="state-msg error">Ошибка загрузки</p>';
            }
        }

        function renderComment(c) {
            const isMine = currentUser && currentUser.id === c.user_id;
            const deleteBtn = isMine
                ? `<button class="comment-delete" onclick="deleteComment(${c.id}, ${c.post_id})">удалить</button>`
                : '';
            return `
                <div class="comment">
                    <div class="comment-header">
                        <span class="comment-author">${escapeHtml(c.author_name)}</span>
                        <span>
                            <span class="comment-date">${new Date(c.created_at).toLocaleString('ru-RU')}</span>
                            ${deleteBtn}
                        </span>
                    </div>
                    <div class="comment-text">${escapeHtml(c.text)}</div>
                </div>
            `;
        }

        function renderCommentForm(postId) {
            const formBox = document.getElementById(`comment-form-${postId}`);
            if (!formBox) return;
            if (!currentUser) {
                formBox.innerHTML = `<p class="comment-login-msg"><a onclick="openAuthModal()">Войдите</a>, чтобы оставить комментарий</p>`;
                return;
            }
            formBox.innerHTML = `
                <form class="comment-form" onsubmit="submitComment(event, ${postId})">
                    <textarea id="comment-text-${postId}" placeholder="Напишите что-нибудь..." maxlength="500" required></textarea>
                    <button type="submit" id="comment-btn-${postId}">Отправить</button>
                </form>
            `;
        }

        async function submitComment(event, postId) {
            event.preventDefault();
            const textarea = document.getElementById(`comment-text-${postId}`);
            const btn = document.getElementById(`comment-btn-${postId}`);
            const text = textarea.value.trim();
            if (!text) return;
            btn.disabled = true;
            btn.textContent = 'Отправка...';
            try {
                await api('/api/comments', {
                    method: 'POST',
                    body: { post_id: postId, text }
                });
                textarea.value = '';
                await loadCommentsForPost(postId);
            } catch (err) { alert('Ошибка: ' + err.message); }
            finally { btn.disabled = false; btn.textContent = 'Отправить'; }
        }

        async function deleteComment(commentId, postId) {
            if (!confirm('Удалить комментарий?')) return;
            try {
                await api('/api/comments/' + commentId, { method: 'DELETE' });
                await loadCommentsForPost(postId);
            } catch (err) { alert('Ошибка: ' + err.message); }
        }

        // ================= МЕССЕНДЖЕР =================
        function renderMessenger() {
            const content = document.getElementById('content');

            if (!currentUser) {
                content.innerHTML = `
                    <div class="messenger noauth">
                        <div class="chat-empty">
                            <div class="big">✦</div>
                            <p style="margin-bottom:1rem;">Чтобы пользоваться сообщениями, войдите в аккаунт.</p>
                            <button class="messenger-login-btn" onclick="openAuthModal()">Войти</button>
                        </div>
                    </div>
                `;
                return;
            }

            content.innerHTML = `
                <div class="messenger" id="messenger">
                    <div class="conversations">
                        <div class="conversations-header">
                            <div class="header-text">
                                <div class="title">Сообщения</div>
                                <div class="subtitle" id="conv-count">0 диалогов</div>
                            </div>
                            <button class="new-chat-btn" onclick="openSearchModal()" title="Новый диалог">+</button>
                        </div>
                        <div class="conversations-list" id="conversations-list">
                            <p style="padding:1.5rem;text-align:center;color:var(--post-dim);font-size:0.85rem;">Загрузка...</p>
                        </div>
                    </div>
                    <div class="chat" id="chat-panel">
                        <div class="chat-empty">
                            <div class="big">✦</div>
                            <p>Выберите диалог слева или нажмите + чтобы найти пользователя.</p>
                        </div>
                    </div>
                </div>
            `;

            loadConversations();
        }

        // ================= ПОИСК ПОЛЬЗОВАТЕЛЕЙ =================
        function openSearchModal() {
            if (!currentUser) { openAuthModal(); return; }
            const old = document.getElementById('search-modal');
            if (old) old.remove();

            const modal = document.createElement('div');
            modal.id = 'search-modal';
            modal.className = 'open';
            modal.innerHTML = `
                <div class="search-modal-content" onclick="event.stopPropagation()">
                    <button class="search-close" onclick="closeSearchModal()">×</button>
                    <h3>Найти пользователя</h3>
                    <input type="text" id="search-input" placeholder="Введите имя..." autocomplete="off" />
                    <div class="search-results" id="search-results">
                        <div class="search-empty">Начните вводить имя</div>
                    </div>
                </div>
            `;
            modal.addEventListener('click', closeSearchModal);
            document.body.appendChild(modal);

            const input = document.getElementById('search-input');
            input.focus();
            let searchTimeout = null;
            input.addEventListener('input', () => {
                clearTimeout(searchTimeout);
                searchTimeout = setTimeout(() => searchUsers(input.value.trim()), 250);
            });
            searchUsers('');
        }

        function closeSearchModal() {
            const modal = document.getElementById('search-modal');
            if (modal) modal.remove();
        }

        async function searchUsers(query) {
            const results = document.getElementById('search-results');
            if (!results) return;
            results.innerHTML = '<div class="search-empty">Поиск...</div>';
            try {
                const q = query ? '?q=' + encodeURIComponent(query) : '';
                const data = await api('/api/users' + q);
                if (!data || data.length === 0) {
                    results.innerHTML = '<div class="search-empty">Никого не найдено</div>';
                    return;
                }
                results.innerHTML = '';
                data.forEach(user => {
                    const item = document.createElement('div');
                    item.className = 'search-result-item';
                    item.onclick = () => {
                        closeSearchModal();
                        const tab = document.querySelector('[data-tab="messages"]');
                        if (tab && !tab.classList.contains('active')) switchTab('messages');
                        setTimeout(() => openChat(user.id, user.username), 100);
                    };
                    item.innerHTML = `
                        <div class="avatar">${escapeHtml(user.username.charAt(0).toUpperCase())}</div>
                        <div class="info">
                            <div class="name">${escapeHtml(user.username)}</div>
                            <div class="hint">нажмите, чтобы написать</div>
                        </div>
                    `;
                    results.appendChild(item);
                });
            } catch (err) {
                console.error(err);
                results.innerHTML = '<div class="search-empty">Ошибка поиска</div>';
            }
        }

        window.currentChatUserId = window.currentChatUserId || null;

        async function loadConversations() {
            const list = document.getElementById('conversations-list');
            if (!list) return;
            try {
                const peerIds = await api('/api/dialogs');
                if (!peerIds || peerIds.length === 0) {
                    list.innerHTML = '<p style="padding:1.5rem;text-align:center;color:var(--post-dim);font-size:0.85rem;">Пока нет диалогов. Нажмите + чтобы начать.</p>';
                    return;
                }

                const allUsers = await api('/api/users');
                const userMap = {};
                allUsers.forEach(u => userMap[u.id] = u.username);

                list.innerHTML = '';
                for (const peerId of peerIds) {
                    const name = userMap[peerId] || 'Пользователь';
                    let preview = '';
                    try {
                        const msgs = await api('/api/messages/' + peerId);
                        if (msgs && msgs.length > 0) preview = msgs[msgs.length - 1].text;
                    } catch (e) {}

                    const item = document.createElement('div');
                    item.className = 'conv-item';
                    item.dataset.userId = peerId;
                    item.onclick = () => openChat(peerId, name);
                    item.innerHTML = `
                        <div class="conv-avatar">${name.charAt(0).toUpperCase()}</div>
                        <div class="conv-info">
                            <div class="conv-name">${escapeHtml(name)}</div>
                            <div class="conv-preview">${escapeHtml(preview)}</div>
                        </div>
                    `;
                    list.appendChild(item);
                }

                const countEl = document.getElementById('conv-count');
                if (countEl) countEl.textContent = peerIds.length + ' ' + pluralize(peerIds.length, ['диалог', 'диалога', 'диалогов']);
            } catch (err) {
                console.error(err);
                list.innerHTML = '<p style="padding:1.5rem;text-align:center;color:var(--post-dim);font-size:0.85rem;">Ошибка загрузки</p>';
            }
        }

        function pluralize(n, forms) {
            const mod10 = n % 10;
            const mod100 = n % 100;
            if (mod10 === 1 && mod100 !== 11) return forms[0];
            if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return forms[1];
            return forms[2];
        }

        async function openChat(userId, userName) {
            window.currentChatUserId = userId;

            const messenger = document.getElementById('messenger');
            if (messenger) messenger.classList.add('mobile-chat-open');

            document.querySelectorAll('.conv-item').forEach(el => {
                el.classList.toggle('active', el.dataset.userId === userId);
            });

            const panel = document.getElementById('chat-panel');
            panel.innerHTML = `
                <div class="chat-header">
                    <button class="chat-back" onclick="closeChatMobile()" title="Назад">←</button>
                    <div class="chat-avatar">${userName.charAt(0).toUpperCase()}</div>
                    <div>
                        <div class="chat-name">${escapeHtml(userName)}</div>
                        <div class="chat-status">в сети</div>
                    </div>
                </div>
                <div class="chat-messages" id="chat-messages">
                    <p class="state-msg">Загрузка...</p>
                </div>
                <div class="chat-input">
                    <textarea id="chat-input" placeholder="Напишите сообщение..." rows="1"></textarea>
                    <button id="chat-send" onclick="sendMessage()">→</button>
                </div>
            `;

            const input = document.getElementById('chat-input');
            input.addEventListener('keydown', e => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            input.addEventListener('input', () => {
                input.style.height = 'auto';
                input.style.height = Math.min(input.scrollHeight, 100) + 'px';
            });

            await loadChatMessages(userId);
        }

        window.closeChatMobile = function() {
            const messenger = document.getElementById('messenger');
            if (messenger) messenger.classList.remove('mobile-chat-open');
            window.currentChatUserId = null;
            document.querySelectorAll('.conv-item').forEach(el => el.classList.remove('active'));
        };

        async function loadChatMessages(userId) {
            const box = document.getElementById('chat-messages');
            if (!box) return;
            try {
                const data = await api('/api/messages/' + userId);
                box.innerHTML = '';
                if (!data || data.length === 0) {
                    box.innerHTML = '<p style="color:var(--post-dim); font-size:0.85rem; text-align:center;">Начните переписку первым</p>';
                    return;
                }
                data.forEach(m => {
                    const div = document.createElement('div');
                    div.className = 'msg ' + (m.sender_id === currentUser.id ? 'mine' : 'theirs');
                    div.dataset.msgId = m.id;
                    div.innerHTML = `
                        ${escapeHtml(m.text)}
                        <span class="msg-time">${new Date(m.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}</span>
                    `;
                    box.appendChild(div);
                });
                box.scrollTop = box.scrollHeight;
            } catch (err) {
                box.innerHTML = '<p class="state-msg error">Ошибка загрузки</p>';
            }
        }

        // ================= REALTIME UI =================
        window.appendMessageToDOM = function(m) {
            const box = document.getElementById('chat-messages');
            if (!box) return;
            if (box.querySelector(`[data-msg-id="${m.id}"]`)) return;

            const placeholder = box.querySelector('p[style*="text-align:center"]');
            if (placeholder && box.children.length === 1) box.innerHTML = '';

            const div = document.createElement('div');
            div.className = 'msg ' + (m.sender_id === currentUser.id ? 'mine' : 'theirs');
            div.dataset.msgId = m.id;
            div.innerHTML = `
                ${escapeHtml(m.text)}
                <span class="msg-time">${new Date(m.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}</span>
            `;
            box.appendChild(div);
            box.scrollTop = box.scrollHeight;
        };

        window.bumpUnread = function(peerId) {
            let item = document.querySelector(`.conv-item[data-user-id="${peerId}"]`);
            if (!item) {
                if (typeof loadConversations === 'function') loadConversations();
                return;
            }
            if (!item.querySelector('.unread-dot')) {
                const dot = document.createElement('span');
                dot.className = 'unread-dot';
                dot.style.cssText = 'width:8px;height:8px;border-radius:50%;background:#c96f4a;display:inline-block;margin-left:6px;';
                item.querySelector('.conv-name')?.appendChild(dot);
            }
            if (typeof loadConversations === 'function') loadConversations();
        };

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const btn = document.getElementById('chat-send');
            const text = input.value.trim();
            if (!text || !window.currentChatUserId) return;

            btn.disabled = true;
            input.value = '';
            input.style.height = 'auto';

            try {
                await api('/api/messages', {
                    method: 'POST',
                    body: { receiver_id: window.currentChatUserId, text }
                });
                await loadChatMessages(window.currentChatUserId);
                loadConversations();
            } catch (err) {
                alert('Ошибка: ' + err.message);
                input.value = text;
            } finally {
                btn.disabled = false;
            }
        }

        // ================= USER =================
        function handleUserClick() {
            if (currentUser) { if (confirm('Выйти из аккаунта?')) logout(); }
            else openAuthModal();
        }

        const originalUpdateAuthUI = window.updateAuthUI;
        window.updateAuthUI = function() {
            if (originalUpdateAuthUI) originalUpdateAuthUI();
            const badge = document.getElementById('user-badge');
            const nameEl = document.getElementById('user-name');
            const avatarEl = document.getElementById('user-avatar');
            if (!badge) return;
            if (currentUser) {
                const name = currentProfile?.username || currentUser.email.split('@')[0];
                nameEl.textContent = name;
                avatarEl.textContent = name.charAt(0).toUpperCase();
            } else {
                nameEl.textContent = 'Войти';
                avatarEl.textContent = '?';
            }
            if (typeof loadPosts === 'function') {
                const postsContainer = document.getElementById('posts-container');
                if (postsContainer) loadPosts();
            }
        };

        // ================= ЗАПУСК =================
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadPosts);
        } else {
            loadPosts();
        }
    </script>

</body>
</html>
