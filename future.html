    <!-- Подключаем файл с постами -->
    <script src="data/posts.js"></script>

    <script>
        const container = document.getElementById('posts-container');

        // Экранирование HTML (защита от XSS)
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            const div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }

        function renderPosts() {
            container.innerHTML = '';

            if (typeof POSTS === 'undefined' || !Array.isArray(POSTS) || POSTS.length === 0) {
                container.innerHTML = '<p class="state-msg">Пока нет постов. Скоро появятся.</p>';
                return;
            }

            // Сортируем по дате: новые сверху
            const sorted = [...POSTS].sort((a, b) => new Date(b.date) - new Date(a.date));

            sorted.forEach(post => {
                const div = document.createElement('div');
                div.className = 'post';
                div.innerHTML = `
                    <h3>${escapeHtml(post.title)}</h3>
                    <span class="date">${escapeHtml(post.date || '')}</span>
                    ${post.image ? `<img src="${escapeHtml(post.image)}" alt="${escapeHtml(post.title)}" loading="lazy" />` : ''}
                    <div class="text">${escapeHtml(post.text)}</div>
                `;
                container.appendChild(div);
            });
        }

        renderPosts();
    </script>
