    <style>
        /* ============================================================
           ТЁМНАЯ ТЕМА (по умолчанию)
           ============================================================ */
        :root {
            --sky: #0a0a0f;
            --sky-2: #0f0f14;
            --sky-3: #14141a;
            --bg-gradient: radial-gradient(ellipse at 20% 0%, rgba(40, 40, 50, 0.5) 0%, transparent 55%),
                           radial-gradient(ellipse at 80% 30%, rgba(30, 30, 40, 0.4) 0%, transparent 55%),
                           linear-gradient(180deg, #0a0a0f 0%, #0f0f14 60%, #14141a 100%);
            --ink: #f5f0e6;
            --ink-soft: #c8c2b8;
            --dim: #6b6b6b;
            --dim-soft: #3a3a3a;
            --line: rgba(245, 240, 230, 0.08);
            --line-strong: rgba(245, 240, 230, 0.18);

            /* Карточки постов — тёмная тема */
            --post-bg: rgba(255, 255, 255, 0.025);
            --post-bg-hover: rgba(255, 255, 255, 0.04);
            --post-border: rgba(255, 255, 255, 0.06);
            --post-border-hover: rgba(255, 255, 255, 0.14);
            --post-text: #f5f0e6;
            --post-text-soft: #c8c2b8;
            --post-dim: #6b6b6b;
            --post-input-bg: rgba(255, 255, 255, 0.02);
            --post-input-bg-focus: rgba(255, 255, 255, 0.04);

            --topbar-bg: rgba(10, 10, 15, 0.8);
            --badge-bg: rgba(10, 10, 15, 0.85);
            --avatar-bg: linear-gradient(135deg, rgba(245, 240, 230, 0.18), rgba(245, 240, 230, 0.05));
            --avatar-border: rgba(245, 240, 230, 0.15);
            --stars-visible: block;
        }

        /* ============================================================
           СВЕТЛАЯ ТЕМА — минимализм, посты тёмные
           ============================================================ */
               html.light {
            --sky: #fafaf7;
            --sky-2: #f5f5f2;
            --sky-3: #f0f0ec;
            --bg-gradient: none;
            --ink: #1a1a1a;
            --ink-soft: #3a3a3a;
            --dim: #8a8a8a;
            --dim-soft: #c8c8c8;
            --line: rgba(26, 26, 26, 0.08);
            --line-strong: rgba(26, 26, 26, 0.18);

            /* Посты — глубокий тёмно-синий (midnight) */
            --post-bg: #0e1a2b;
            --post-bg-hover: #142138;
            --post-border: rgba(140, 170, 210, 0.1);
            --post-border-hover: rgba(140, 170, 210, 0.25);
            --post-text: #f5f0e6;
            --post-text-soft: #b8c2d4;
            --post-dim: #6b7a94;
            --post-input-bg: rgba(255, 255, 255, 0.04);
            --post-input-bg-focus: rgba(255, 255, 255, 0.07);

            --topbar-bg: rgba(250, 250, 247, 0.9);
            --badge-bg: rgba(250, 250, 247, 0.95);
            --avatar-bg: linear-gradient(135deg, rgba(26, 26, 26, 0.08), rgba(26, 26, 26, 0.03));
            --avatar-border: rgba(26, 26, 26, 0.1);
            --stars-visible: none;
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { min-height: 100%; }

        body {
            background: var(--sky);
            background-image: var(--bg-gradient);
            background-attachment: fixed;
            color: var(--ink);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            font-weight: 400;
            line-height: 1.55;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            position: relative;
            transition: background 0.4s ease, color 0.4s ease;
        }

        /* ================= ЗВЁЗДЫ ================= */
        .starfield {
            position: fixed; inset: 0; z-index: 0;
            pointer-events: none; overflow: hidden;
            display: var(--stars-visible);
        }
        .star { position: absolute; border-radius: 50%; will-change: opacity, transform; background: #ffffff; }
        .star.s-1 { box-shadow: 0 0 1px rgba(255,255,255,0.6); }
        .star.s-2 { box-shadow: 0 0 3px rgba(255,255,255,0.9), 0 0 6px rgba(220,220,220,0.4); }
        .star.s-3 { box-shadow: 0 0 4px rgba(255,255,255,1), 0 0 10px rgba(220,220,220,0.7), 0 0 20px rgba(200,200,200,0.3); }
        .star.s-4 { box-shadow: 0 0 6px rgba(255,255,255,1), 0 0 14px rgba(220,220,220,0.8), 0 0 28px rgba(200,200,200,0.5), 0 0 48px rgba(200,200,200,0.2); }
        @keyframes tw-slow { 0%,100% { opacity: 0.35; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1); } }
        @keyframes tw-mid  { 0%,100% { opacity: 0.5; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1); } }
        @keyframes tw-fast { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }
        .star.t-1 { animation: tw-slow 6s ease-in-out infinite; }
        .star.t-2 { animation: tw-mid 3.5s ease-in-out infinite; }
        .star.t-3 { animation: tw-fast 2s ease-in-out infinite; }
        @keyframes drift { 0% { transform: translate(0, 0); } 100% { transform: translate(-30px, -50px); } }
        .starfield { animation: drift 180s linear infinite alternate; }

        .page {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 4rem;
        }

        /* ================= TOP BAR ================= */
        .top-bar {
            background: var(--topbar-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            color: var(--ink-soft);
            text-align: center;
            padding: 0.8rem 1rem;
            font-size: 0.72rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            font-weight: 500;
            border-bottom: 1px solid var(--line);
            position: relative;
            z-index: 3;
            transition: background 0.4s ease, border-color 0.4s ease;
        }
        .top-bar a { color: var(--ink-soft); text-decoration: none; transition: color 0.3s; }
        .top-bar a:hover { color: var(--ink); }
        .top-bar .sep { display: inline-block; margin: 0 1rem; opacity: 0.4; }

        /* ================= КНОПКИ В УГЛУ ================= */
        .corner-controls {
            position: fixed;
            top: 60px;
            right: 24px;
            z-index: 50;
            display: flex;
            gap: 0.5rem;
            align-items: center;
        }

        .theme-toggle {
            padding: 0.55rem 1.1rem;
            border-radius: 20px;
            background: var(--badge-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--line);
            color: var(--ink-soft);
            cursor: pointer;
            font-size: 0.68rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s;
            font-family: inherit;
        }
        .theme-toggle:hover {
            border-color: var(--line-strong);
            background: var(--badge-bg);
            color: var(--ink);
        }

        .user-badge {
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.5rem 1rem 0.5rem 0.5rem;
            background: var(--badge-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--line);
            border-radius: 30px;
            font-size: 0.8rem;
            color: var(--ink-soft);
            cursor: pointer;
            transition: all 0.3s;
        }
        .user-badge:hover {
            border-color: var(--line-strong);
            background: var(--badge-bg);
        }
        .user-badge .avatar {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: var(--avatar-bg);
            border: 1px solid var(--avatar-border);
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--ink);
            font-weight: 500;
            font-size: 0.75rem;
        }
        .user-badge .name {
            max-width: 120px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ================= HERO ================= */
        .hero {
            max-width: 1000px;
            margin: 0 auto;
            padding: 5rem 2rem 3rem;
            text-align: center;
            position: relative;
            z-index: 5;
            width: 100%;
        }
        .hero h1 {
            font-size: clamp(4rem, 14vw, 10rem);
            font-weight: 200;
            line-height: 1;
            letter-spacing: -0.05em;
            margin-bottom: 1.5rem;
            color: var(--ink);
            transition: color 0.4s ease, text-shadow 0.4s ease;
        }
        html:not(.light) .hero h1 {
            text-shadow: 0 0 80px rgba(245, 240, 230, 0.2);
        }
        .hero h1 em {
            font-style: normal;
            font-weight: 600;
        }
        .hero .sub {
            font-size: 1rem;
            color: var(--dim);
            line-height: 1.7;
            font-weight: 400;
            max-width: 560px;
            margin: 0 auto;
        }

        /* ================= TABS ================= */
        .tabs {
            max-width: 1400px;
            margin: 3rem auto 0;
            padding: 0 2.5rem;
            display: flex;
            gap: 2.5rem;
            border-bottom: 1px solid var(--line);
            width: 100%;
            position: relative;
            z-index: 5;
        }
        .tab {
            background: none; border: none;
            color: var(--dim);
            font-family: inherit;
            font-size: 0.75rem;
            font-weight: 500;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            padding: 1.2rem 0;
            cursor: pointer;
            position: relative;
            transition: color 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
        }
        .tab::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 0; right: 0;
            height: 1px;
            background: var(--ink);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1);
        }
        .tab:hover { color: var(--ink-soft); }
        .tab.active { color: var(--ink); }
        .tab.active::after { transform: scaleX(1); }
        .tab .tab-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--dim-soft);
            transition: background 0.3s ease;
        }
        .tab.active .tab-dot { background: var(--ink); }

        /* ================= CONTENT ================= */
        .content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 3rem 2.5rem 5rem;
            flex: 1;
            width: 100%;
            position: relative;
            z-index: 5;
        }

        /* ================= ПОСТЫ ================= */
        .posts {
            display: flex;
            flex-direction: column;
            gap: 1.5rem;
            max-width: 720px;
            margin: 0 auto;
        }

        .post {
            padding: 1.8rem 2rem;
            border-radius: 20px;
            background: var(--post-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--post-border);
            transition: border-color 0.3s ease, transform 0.3s cubic-bezier(0.2, 0, 0, 1), box-shadow 0.3s ease, background 0.4s ease;
            position: relative;
        }

        .post:hover {
            border-color: var(--post-border-hover);
            transform: translateY(-2px);
        }
        html:not(.light) .post:hover {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
        }
        html.light .post:hover {
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.2);
        }

        .post h3 {
            font-size: 1.3rem;
            font-weight: 600;
            letter-spacing: -0.02em;
            line-height: 1.3;
            margin-bottom: 0.4rem;
            color: var(--post-text);
        }

        .post .date {
            font-size: 0.72rem;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: var(--post-dim);
            display: block;
            margin-bottom: 1.2rem;
            font-weight: 500;
        }

        .post img {
            max-width: 100%;
            border-radius: 12px;
            margin: 1rem 0;
            display: block;
            border: 1px solid var(--post-border);
        }

        .post .text {
            color: var(--post-text-soft);
            font-size: 0.98rem;
            line-height: 1.7;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-weight: 400;
        }

        /* ================= КОММЕНТАРИИ ================= */
        .comments-section {
            margin-top: 1.6rem;
            padding-top: 1.4rem;
            border-top: 1px solid var(--post-border);
        }

        .comments-title {
            color: var(--post-dim);
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.18em;
            margin-bottom: 1rem;
            font-weight: 600;
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
            margin-bottom: 1rem;
        }

        .comment {
            padding: 0.8rem 1rem;
            border-radius: 12px;
            background: var(--post-input-bg);
            border: 1px solid var(--post-border);
            transition: border-color 0.25s ease, background 0.25s ease;
        }

        .comment:hover {
            border-color: var(--post-border-hover);
            background: var(--post-input-bg-focus);
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.3rem;
            font-size: 0.82rem;
            gap: 0.5rem;
        }

        .comment-author {
            color: var(--post-text);
            font-weight: 600;
        }

        .comment-date {
            color: var(--post-dim);
            font-size: 0.7rem;
        }

        .comment-text {
            color: var(--post-text-soft);
            font-size: 0.92rem;
            line-height: 1.6;
        }

        .comment-delete {
            background: none;
            border: none;
            color: var(--post-dim);
            cursor: pointer;
            font-size: 0.7rem;
            margin-left: 8px;
            font-family: inherit;
            transition: color 0.2s;
        }

        .comment-delete:hover { color: var(--post-text); }

        .comment-form {
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }

        .comment-form textarea {
            background: var(--post-input-bg);
            border: 1px solid var(--post-border);
            border-radius: 12px;
            padding: 11px 14px;
            color: var(--post-text);
            font-family: inherit;
            font-size: 0.92rem;
            resize: vertical;
            min-height: 52px;
            transition: border-color 0.25s ease, background 0.25s ease;
            font-weight: 400;
            line-height: 1.5;
        }

        .comment-form textarea:focus {
            outline: none;
            border-color: var(--post-border-hover);
            background: var(--post-input-bg-focus);
        }

        .comment-form textarea::placeholder { color: var(--post-dim); }

        .comment-form button {
            align-self: flex-end;
            background: transparent;
            color: var(--post-text);
            border: 1px solid var(--post-border-hover);
            padding: 8px 20px;
            border-radius: 100px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            font-size: 0.72rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            transition: all 0.25s cubic-bezier(0.2, 0, 0, 1);
        }

        .comment-form button:hover {
            background: var(--post-text);
            color: var(--post-bg);
            border-color: var(--post-text);
        }

        .comment-form button:disabled {
            opacity: 0.4;
            cursor: not-allowed;
        }

        .comment-login-msg {
            color: var(--post-dim);
            font-size: 0.85rem;
            font-style: italic;
            padding: 1rem;
            text-align: center;
            border: 1px dashed var(--post-border-hover);
            border-radius: 12px;
        }

        .comment-login-msg a {
            color: var(--post-text);
            text-decoration: none;
            font-style: normal;
            font-weight: 500;
            cursor: pointer;
            border-bottom: 1px dotted var(--post-border-hover);
        }

        .comment-login-msg a:hover { border-bottom-color: var(--post-text); }

        /* ================= МЕССЕНДЖЕР ================= */
        .messenger {
            display: grid;
            grid-template-columns: 300px 1fr;
            background: var(--post-bg);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--post-border);
            border-radius: 20px;
            overflow: hidden;
            height: 620px;
            max-width: 1100px;
            margin: 0 auto;
        }
                html.light .messenger {
            background: #0e1a2b;
            border-color: rgba(140, 170, 210, 0.12);
        }

        .conversations {
            border-right: 1px solid var(--post-border);
            display: flex;
            flex-direction: column;
            background: var(--post-input-bg);
        }
        html.light .conversations {
            background: rgba(0, 0, 0, 0.2);
            border-color: rgba(255, 255, 255, 0.06);
        }
        .conversations-header {
            padding: 1.4rem 1.4rem 1.2rem;
            border-bottom: 1px solid var(--post-border);
        }
        .conversations-header .title {
            font-size: 1rem;
            font-weight: 600;
            color: var(--post-text);
            margin-bottom: 0.3rem;
        }
        .conversations-header .subtitle {
            font-size: 0.68rem;
            letter-spacing: 0.15em;
            text-transform: uppercase;
            color: var(--post-dim);
        }
        .conversations-list {
            flex: 1;
            overflow-y: auto;
            padding: 0.5rem;
        }
        .conversations-list::-webkit-scrollbar { width: 4px; }
        .conversations-list::-webkit-scrollbar-thumb { background: var(--line-strong); border-radius: 2px; }

        .conv-item {
            display: flex;
            align-items: center;
            gap: 0.8rem;
            padding: 0.75rem 0.9rem;
            border-radius: 12px;
            cursor: pointer;
            transition: background 0.2s;
            border: 1px solid transparent;
        }
        .conv-item:hover { background: var(--post-input-bg-focus); }
        .conv-item.active {
            background: var(--post-input-bg-focus);
            border-color: var(--post-border-hover);
        }
        .conv-item .conv-avatar {
            width: 38px; height: 38px;
            border-radius: 50%;
            background: var(--post-input-bg-focus);
            border: 1px solid var(--post-border-hover);
            display: flex; align-items: center; justify-content: center;
            color: var(--post-text); font-weight: 500; font-size: 0.9rem;
            flex-shrink: 0;
        }
        .conv-item .conv-info { flex: 1; min-width: 0; }
        .conv-item .conv-name {
            font-size: 0.92rem;
            font-weight: 500;
            color: var(--post-text);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }
        .conv-item .conv-preview {
            font-size: 0.75rem;
            color: var(--post-dim);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
            margin-top: 2px;
        }

        .chat {
            display: flex;
            flex-direction: column;
            background: transparent;
        }
        .chat-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100%;
            color: var(--post-dim);
            padding: 2rem;
            text-align: center;
        }
        .chat-empty .big {
            font-size: 2rem;
            color: var(--post-dim);
            margin-bottom: 1rem;
        }
        .chat-empty p {
            font-size: 0.95rem;
            max-width: 260px;
            line-height: 1.6;
            color: var(--post-text-soft);
        }

        .chat-header {
            padding: 1rem 1.4rem;
            border-bottom: 1px solid var(--post-border);
            display: flex;
            align-items: center;
            gap: 0.8rem;
        }
        .chat-header .chat-avatar {
            width: 36px; height: 36px;
            border-radius: 50%;
            background: var(--post-input-bg-focus);
            border: 1px solid var(--post-border-hover);
            display: flex; align-items: center; justify-content: center;
            color: var(--post-text); font-weight: 500; font-size: 0.85rem;
            flex-shrink: 0;
        }
        .chat-header .chat-name {
            font-size: 1rem;
            font-weight: 600;
            color: var(--post-text);
        }
        .chat-header .chat-status {
            font-size: 0.68rem;
            color: var(--post-dim);
            letter-spacing: 0.1em;
            text-transform: uppercase;
            margin-top: 2px;
        }

        .chat-messages {
            flex: 1;
            overflow-y: auto;
            padding: 1.5rem;
            display: flex;
            flex-direction: column;
            gap: 0.6rem;
        }
        .chat-messages::-webkit-scrollbar { width: 4px; }

        /* ================= АДАПТИВ ================= */

    <script>
    (function() {
        'use strict';

        // ============ ТЕМА ============
        function applyTheme(theme) {
            const btn = document.getElementById('theme-toggle');
            if (theme === 'light') {
                document.documentElement.classList.add('light');
                if (btn) btn.textContent = 'Светлая';
            } else {
                document.documentElement.classList.remove('light');
                if (btn) btn.textContent = 'Тёмная';
            }
        }

        window.toggleTheme = function() {
            const isLight = document.documentElement.classList.contains('light');
            const newTheme = isLight ? 'dark' : 'light';
            localStorage.setItem('ify_theme', newTheme);
            applyTheme(newTheme);
        };

        (function initTheme() {
            const saved = localStorage.getItem('ify_theme');
            const prefersLight = window.matchMedia('(prefers-color-scheme: light)').matches;
            applyTheme(saved || (prefersLight ? 'light' : 'dark'));
        })();

        // ============ ЗВЁЗДЫ ============
        function createStarfield() {
            const field = document.createElement('div');
            field.className = 'starfield';
            const count = window.innerWidth < 640 ? 140 : 260;
            const configs = [
                { prob: 0.55, min: 0.5, max: 1.0, size: 's-1', speed: 't-1' },
                { prob: 0.20, min: 0.9, max: 1.4, size: 's-2', speed: 't-2' },
                { prob: 0.15, min: 1.1, max: 1.8, size: 's-2', speed: 't-2' },
                { prob: 0.07, min: 1.8, max: 2.4, size: 's-3', speed: 't-3' },
                { prob: 0.03, min: 2.4, max: 3.2, size: 's-4', speed: 't-1' }
            ];
            function pickConfig() {
                const r = Math.random(); let acc = 0;
                for (const c of configs) { acc += c.prob; if (r < acc) return c; }
                return configs[0];
            }
            for (let i = 0; i < count; i++) {
                const cfg = pickConfig();
                const star = document.createElement('div');
                star.className = 'star ' + cfg.size + ' ' + cfg.speed;
                const size = cfg.min + Math.random() * (cfg.max - cfg.min);
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = (Math.random() * 6) + 's';
                field.appendChild(star);
            }
            document.body.insertBefore(field, document.body.firstChild);
        }

        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', createStarfield);
        } else { createStarfield(); }
    })();
    </script>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="auth.js"></script>

    <script>
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            const div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }

        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(el => {
                el.classList.toggle('active', el.dataset.tab === tab);
            });

            const content = document.getElementById('content');

            if (tab === 'channel') {
                content.innerHTML = '<div class="posts" id="posts-container"><p class="state-msg">Загрузка...</p></div>';
                loadPosts();
            } else if (tab === 'messages') {
                renderMessenger();
            }
        }

        // ================= ПОСТЫ =================
        async function loadPosts() {
            const container = document.getElementById('posts-container');
            if (!container) return;

            container.innerHTML = '<p class="state-msg">Загрузка...</p>';

            try {
                const { data, error } = await db
                    .from('posts')
                    .select('*')
                    .order('created_at', { ascending: false });

                if (error) throw error;

                container.innerHTML = '';

                if (!data || data.length === 0) {
                    container.innerHTML = '<p class="state-msg">Пока нет постов. Скоро появятся.</p>';
                    return;
                }

                data.forEach(post => {
                    const div = document.createElement('div');
                    div.className = 'post';
                    div.innerHTML = `
                        <h3>${escapeHtml(post.title)}</h3>
                        <span class="date">${escapeHtml(post.date || '')}</span>
                        ${post.image_url ? `<img src="${escapeHtml(post.image_url)}" alt="${escapeHtml(post.title)}" loading="lazy" />` : ''}
                        <div class="text">${escapeHtml(post.text)}</div>
                        <div class="comments-section">
                            <div class="comments-title">Комментарии</div>
                            <div class="comments-list" id="comments-${post.id}">
                                <p class="state-msg">Загрузка...</p>
                            </div>
                            <div id="comment-form-${post.id}"></div>
                        </div>
                    `;
                    container.appendChild(div);
                });

                data.forEach(post => loadCommentsForPost(post.id));

            } catch (err) {
                console.error('Ошибка загрузки постов:', err);
                container.innerHTML = '<p class="state-msg error">Не удалось загрузить посты.</p>';
            }
        }

        // ================= КОММЕНТАРИИ =================
        async function loadCommentsForPost(postId) {
            const list = document.getElementById(`comments-${postId}`);
            if (!list) return;

            const { data, error } = await db
                .from('comments')
                .select('*')
                .eq('post_id', postId)
                .order('created_at', { ascending: true });

            if (error) {
                list.innerHTML = '<p class="state-msg error">Ошибка загрузки</p>';
                return;
            }

            if (!data || data.length === 0) {
                list.innerHTML = '<p style="color:var(--post-dim); font-size:0.85rem; text-align:center; padding:0.4rem;">Пока нет комментариев</p>';
            } else {
                list.innerHTML = data.map(c => renderComment(c)).join('');
            }

            renderCommentForm(postId);
        }

        function renderComment(c) {
            const isMine = currentUser && currentUser.id === c.user_id;
            const deleteBtn = isMine
                ? `<button class="comment-delete" onclick="deleteComment(${c.id}, ${c.post_id})">удалить</button>`
                : '';
            return `
                <div class="comment">
                    <div class="comment-header">
                        <span class="comment-author">${escapeHtml(c.author_name)}</span>
                        <span>
                            <span class="comment-date">${new Date(c.created_at).toLocaleString('ru-RU')}</span>
                            ${deleteBtn}
                        </span>
                    </div>
                    <div class="comment-text">${escapeHtml(c.text)}</div>
                </div>
            `;
        }

        function renderCommentForm(postId) {
            const formBox = document.getElementById(`comment-form-${postId}`);
            if (!formBox) return;

            if (!currentUser) {
                formBox.innerHTML = `
                    <p class="comment-login-msg">
                        <a onclick="openAuthModal()">Войдите</a>, чтобы оставить комментарий
                    </p>
                `;
                return;
            }

            formBox.innerHTML = `
                <form class="comment-form" onsubmit="submitComment(event, ${postId})">
                    <textarea id="comment-text-${postId}" placeholder="Напишите что-нибудь..." maxlength="500" required></textarea>
                    <button type="submit" id="comment-btn-${postId}">Отправить</button>
                </form>
            `;
        }

        async function submitComment(event, postId) {
            event.preventDefault();
            const textarea = document.getElementById(`comment-text-${postId}`);
            const btn = document.getElementById(`comment-btn-${postId}`);
            const text = textarea.value.trim();
            if (!text) return;

            btn.disabled = true;
            btn.textContent = 'Отправка...';

            try {
                const { error } = await db.from('comments').insert({
                    post_id: postId,
                    user_id: currentUser.id,
                    author_name: currentProfile?.username || currentUser.email.split('@')[0],
                    text: text
                });
                if (error) throw error;
                textarea.value = '';
                await loadCommentsForPost(postId);
            } catch (err) {
                alert('Ошибка: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Отправить';
            }
        }

        async function deleteComment(commentId, postId) {
            if (!confirm('Удалить комментарий?')) return;
            const { error } = await db.from('comments').delete().eq('id', commentId);
            if (error) { alert('Ошибка: ' + error.message); return; }
            await loadCommentsForPost(postId);
        }

        // ================= МЕССЕНДЖЕР =================
        function renderMessenger() {
            const content = document.getElementById('content');

            if (!currentUser) {
                content.innerHTML = `
                    <div class="messenger" style="display:flex;align-items:center;justify-content:center;">
                        <div class="chat-empty">
                            <div class="big">✦</div>
                            <p style="margin-bottom:1rem;">Чтобы пользоваться сообщениями, войдите в аккаунт.</p>
                            <button onclick="openAuthModal()" style="padding:10px 24px;background:var(--post-text);color:var(--post-bg);border:none;border-radius:100px;cursor:pointer;font-family:inherit;font-weight:600;font-size:0.78rem;letter-spacing:0.15em;text-transform:uppercase;">Войти</button>
                        </div>
                    </div>
                `;
                return;
            }

            content.innerHTML = `
                <div class="messenger">
                    <div class="conversations">
                        <div class="conversations-header">
                            <div class="title">Сообщения</div>
                            <div class="subtitle" id="conv-count">0 диалогов</div>
                        </div>
                        <div class="conversations-list" id="conversations-list">
                            <p style="padding:1.5rem;text-align:center;color:var(--post-dim);font-size:0.85rem;">Загрузка...</p>
                        </div>
                    </div>
                    <div class="chat" id="chat-panel">
                        <div class="chat-empty">
                            <div class="big">✦</div>
                            <p>Выберите диалог слева, чтобы начать переписку.</p>
                        </div>
                    </div>
                </div>
            `;

            loadConversations();
        }

        let currentChatUserId = null;
        let messageChannel = null;

        async function loadConversations() {
            const list = document.getElementById('conversations-list');
            if (!list) return;

            try {
                const { data, error } = await db
                    .from('messages')
                    .select('*')
                    .or(`sender_id.eq.${currentUser.id},receiver_id.eq.${currentUser.id}`)
                    .order('created_at', { ascending: false });

                if (error) throw error;

                const convMap = {};
                (data || []).forEach(m => {
                    const otherId = m.sender_id === currentUser.id ? m.receiver_id : m.sender_id;
                    if (!convMap[otherId]) {
                        convMap[otherId] = {
                            id: otherId,
                            lastMessage: m.text,
                            lastTime: m.created_at
                        };
                    }
                });

                const conversations = Object.values(convMap);

                if (conversations.length === 0) {
                    list.innerHTML = '<p style="padding:1.5rem;text-align:center;color:var(--post-dim);font-size:0.85rem;">Пока нет диалогов</p>';
                    return;
                }

                const ids = conversations.map(c => c.id);
                const { data: profiles } = await db
                    .from('profiles')
                    .select('id, username')
                    .in('id', ids);

                const profMap = {};
                (profiles || []).forEach(p => profMap[p.id] = p.username);

                list.innerHTML = '';
                conversations.forEach(c => {
                    const name = profMap[c.id] || 'Пользователь';
                    const item = document.createElement('div');
                    item.className = 'conv-item';
                    item.dataset.userId = c.id;
                    item.onclick = () => openChat(c.id, name);
                    item.innerHTML = `
                        <div class="conv-avatar">${name.charAt(0).toUpperCase()}</div>
                        <div class="conv-info">
                            <div class="conv-name">${escapeHtml(name)}</div>
                            <div class="conv-preview">${escapeHtml(c.lastMessage)}</div>
                        </div>
                    `;
                    list.appendChild(item);
                });

                const countEl = document.getElementById('conv-count');
                if (countEl) countEl.textContent = conversations.length + ' ' + pluralize(conversations.length, ['диалог', 'диалога', 'диалогов']);

            } catch (err) {
                console.error(err);
                list.innerHTML = '<p style="padding:1.5rem;text-align:center;color:var(--post-dim);font-size:0.85rem;">Ошибка загрузки</p>';
            }
        }

        function pluralize(n, forms) {
            const mod10 = n % 10;
            const mod100 = n % 100;
            if (mod10 === 1 && mod100 !== 11) return forms[0];
            if (mod10 >= 2 && mod10 <= 4 && (mod100 < 10 || mod100 >= 20)) return forms[1];
            return forms[2];
        }

        async function openChat(userId, userName) {
            currentChatUserId = userId;

            document.querySelectorAll('.conv-item').forEach(el => {
                el.classList.toggle('active', el.dataset.userId === userId);
            });

            const panel = document.getElementById('chat-panel');
            panel.innerHTML = `
                <div class="chat-header">
                    <div class="chat-avatar">${userName.charAt(0).toUpperCase()}</div>
                    <div>
                        <div class="chat-name">${escapeHtml(userName)}</div>
                        <div class="chat-status">в сети</div>
                    </div>
                </div>
                <div class="chat-messages" id="chat-messages">
                    <p class="state-msg">Загрузка...</p>
                </div>
                <div class="chat-input">
                    <textarea id="chat-input" placeholder="Напишите сообщение..." rows="1"></textarea>
                    <button id="chat-send" onclick="sendMessage()">→</button>
                </div>
            `;

            const input = document.getElementById('chat-input');
            input.addEventListener('keydown', e => {
                if (e.key === 'Enter' && !e.shiftKey) {
                    e.preventDefault();
                    sendMessage();
                }
            });
            input.addEventListener('input', () => {
                input.style.height = 'auto';
                input.style.height = Math.min(input.scrollHeight, 100) + 'px';
            });

            await loadChatMessages(userId);
            subscribeToMessages(userId);
        }

        async function loadChatMessages(userId) {
            const box = document.getElementById('chat-messages');
            if (!box) return;

            const { data, error } = await db
                .from('messages')
                .select('*')
                .or(`and(sender_id.eq.${currentUser.id},receiver_id.eq.${userId}),and(sender_id.eq.${userId},receiver_id.eq.${currentUser.id})`)
                .order('created_at', { ascending: true });

            if (error) {
                box.innerHTML = '<p class="state-msg error">Ошибка загрузки</p>';
                return;
            }

            box.innerHTML = '';

            if (!data || data.length === 0) {
                box.innerHTML = '<p style="color:var(--post-dim); font-size:0.85rem; text-align:center;">Начните переписку первым</p>';
                return;
            }

            data.forEach(m => {
                const div = document.createElement('div');
                div.className = 'msg ' + (m.sender_id === currentUser.id ? 'mine' : 'theirs');
                div.innerHTML = `
                    ${escapeHtml(m.text)}
                    <span class="msg-time">${new Date(m.created_at).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' })}</span>
                `;
                box.appendChild(div);
            });

            box.scrollTop = box.scrollHeight;
        }

        async function sendMessage() {
            const input = document.getElementById('chat-input');
            const btn = document.getElementById('chat-send');
            const text = input.value.trim();
            if (!text || !currentChatUserId) return;

            btn.disabled = true;
            input.value = '';
            input.style.height = 'auto';

            try {
                const { error } = await db.from('messages').insert({
                    sender_id: currentUser.id,
                    receiver_id: currentChatUserId,
                    text: text
                });
                if (error) throw error;
                await loadChatMessages(currentChatUserId);
                loadConversations();
            } catch (err) {
                alert('Ошибка: ' + err.message);
                input.value = text;
            } finally {
                btn.disabled = false;
            }
        }

        function subscribeToMessages(userId) {
            if (messageChannel) {
                db.removeChannel(messageChannel);
            }
            messageChannel = db
                .channel('messages-' + userId)
                .on('postgres_changes', {
                    event: 'INSERT',
                    schema: 'public',
                    table: 'messages'
                }, payload => {
                    const m = payload.new;
                    if ((m.sender_id === currentUser.id && m.receiver_id === userId) ||
                        (m.sender_id === userId && m.receiver_id === currentUser.id)) {
                        loadChatMessages(userId);
                    }
                })
                .subscribe();
        }

        // ================= USER =================
        function handleUserClick() {
            if (currentUser) {
                if (confirm('Выйти из аккаунта?')) logout();
            } else {
                openAuthModal();
            }
        }

        const originalUpdateAuthUI = window.updateAuthUI;
        window.updateAuthUI = function() {
            if (originalUpdateAuthUI) originalUpdateAuthUI();

            const badge = document.getElementById('user-badge');
            const nameEl = document.getElementById('user-name');
            const avatarEl = document.getElementById('user-avatar');

            if (!badge) return;

            if (currentUser) {
                const name = currentProfile?.username || currentUser.email.split('@')[0];
                nameEl.textContent = name;
                avatarEl.textContent = name.charAt(0).toUpperCase();
            } else {
                nameEl.textContent = 'Войти';
                avatarEl.textContent = '?';
            }
        };

        // ================= ЗАПУСК =================
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadPosts);
        } else {
            loadPosts();
        }
    </script>

</body>
</html>
