<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>IFY — I want to be forever young</title>
    <link rel="icon" type="image/png" href="images/icon-192x192.png" />
    <link rel="apple-touch-icon" href="images/icon-512x512.png" />
    <meta http-equiv="X-Content-Type-Options" content="nosniff" />
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'unsafe-inline' https://fonts.googleapis.com https://onesignal.com; font-src https://fonts.gstatic.com; img-src 'self' data: https://*; script-src 'self' 'unsafe-inline' https://cdn.onesignal.com https://api.onesignal.com https://cdn.jsdelivr.net; connect-src 'self' https://api.onesignal.com https://onesignal.com https://cdn.onesignal.com https://mwnanyuukoidlabekeft.supabase.co wss://mwnanyuukoidlabekeft.supabase.co; worker-src 'self' blob:;" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,300;0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,300;1,9..144,400&family=Inter:wght@300;400;500&display=swap" rel="stylesheet" />
    <link rel="manifest" href="/snl/manifest.json" />

    <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
    <script>
      window.OneSignalDeferred = window.OneSignalDeferred || [];
      OneSignalDeferred.push(async function(OneSignal) {
        await OneSignal.init({
          appId: "32bc1c1a-e834-48e6-ad0b-e46fcfa2a2c6",
          serviceWorkerParam: { scope: "/snl/" },
          serviceWorkerPath: "/snl/OneSignalSDKWorker.js",
        });
      });
    </script>

    <style>
        :root {
            --sky: #0a1024;
            --sky-2: #0e1630;
            --sky-3: #131a3a;
            --ink: #f4ede2;
            --ink-soft: #dcd0bd;
            --dim: #8b93a8;
            --dim-soft: #5a6480;
            --line: rgba(244, 237, 226, 0.1);
            --line-strong: rgba(244, 237, 226, 0.2);

            /* Палитра IFY — сливово-фиолетовая */
            --plum: #b088b0;
            --plum-soft: #c9a8c8;
            --plum-bright: #d8b8d8;
            --violet: #a78bfa;
            --violet-soft: #c4b5fd;
            --rose: #f472b6;
            --glow: rgba(176, 136, 176, 0.5);
        }

        * { margin: 0; padding: 0; box-sizing: border-box; }

        html, body { min-height: 100%; }

        body {
            background: var(--sky);
            background-image:
                radial-gradient(ellipse at 20% 0%, rgba(60, 30, 80, 0.45) 0%, transparent 55%),
                radial-gradient(ellipse at 80% 30%, rgba(80, 40, 100, 0.35) 0%, transparent 55%),
                radial-gradient(ellipse at 50% 100%, rgba(40, 30, 90, 0.45) 0%, transparent 60%),
                linear-gradient(180deg, var(--sky) 0%, var(--sky-2) 60%, var(--sky-3) 100%);
            background-attachment: fixed;
            color: var(--ink);
            font-family: 'Inter', sans-serif;
            font-weight: 300;
            line-height: 1.55;
            min-height: 100vh;
            -webkit-font-smoothing: antialiased;
            overflow-x: hidden;
            position: relative;
        }

        /* ================= ЗВЁЗДЫ ================= */
        .starfield { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
        .star { position: absolute; border-radius: 50%; will-change: opacity, transform; }
        .star.c-white { background: #ffffff; }
        .star.c-blue  { background: #b8d4ff; }
        .star.c-gold  { background: #ffe6b0; }
        .star.c-warm  { background: #ffd0a0; }
        .star.c-pink  { background: #ffd4e0; }
        .star.s-1 { box-shadow: 0 0 1px rgba(255,255,255,0.6); }
        .star.s-2 { box-shadow: 0 0 3px rgba(255,255,255,0.9), 0 0 6px rgba(180,210,255,0.4); }
        .star.s-3 { box-shadow: 0 0 4px rgba(255,255,255,1), 0 0 10px rgba(180,210,255,0.7), 0 0 20px rgba(120,180,255,0.3); }
        .star.s-4 { box-shadow: 0 0 6px rgba(255,255,255,1), 0 0 14px rgba(200,220,255,0.8), 0 0 28px rgba(120,180,255,0.5), 0 0 48px rgba(120,180,255,0.2); }
        @keyframes tw-slow { 0%,100% { opacity: 0.35; transform: scale(0.9); } 50% { opacity: 1; transform: scale(1); } }
        @keyframes tw-mid  { 0%,100% { opacity: 0.5; transform: scale(0.95); } 50% { opacity: 1; transform: scale(1); } }
        @keyframes tw-fast { 0%,100% { opacity: 0.7; } 50% { opacity: 1; } }
        .star.t-1 { animation: tw-slow 6s ease-in-out infinite; }
        .star.t-2 { animation: tw-mid 3.5s ease-in-out infinite; }
        .star.t-3 { animation: tw-fast 2s ease-in-out infinite; }
        @keyframes drift { 0% { transform: translate(0, 0); } 100% { transform: translate(-30px, -50px); } }
        .starfield { animation: drift 180s linear infinite alternate; }

        /* ================= КОНТЕНТ ================= */
        .page {
            position: relative;
            z-index: 2;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            padding-bottom: 4rem;
        }

        .top-bar {
            background: rgba(10, 16, 36, 0.75);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            color: var(--ink-soft);
            text-align: center;
            padding: 0.75rem 1rem;
            font-size: 0.65rem;
            letter-spacing: 0.35em;
            text-transform: uppercase;
            font-weight: 400;
            border-bottom: 1px solid var(--line);
            position: relative;
            z-index: 3;
        }

        .top-bar a {
            color: var(--ink-soft);
            text-decoration: none;
            transition: color 0.3s;
        }
        .top-bar a:hover { color: var(--plum-soft); }
        .top-bar .sep {
            display: inline-block;
            margin: 0 1rem;
            opacity: 0.4;
        }

        /* ================= HERO ================= */
        .hero {
            max-width: 1000px;
            margin: 0 auto;
            padding: 6rem 2rem 3rem;
            text-align: center;
            position: relative;
            z-index: 5;
            width: 100%;
        }

        .hero .eyebrow {
            font-size: 0.68rem; letter-spacing: 0.4em;
            text-transform: uppercase; color: var(--plum-soft);
            margin-bottom: 1.5rem; font-weight: 500;
            display: inline-flex; align-items: center; gap: 0.8rem;
        }
        .hero .eyebrow::before,
        .hero .eyebrow::after {
            content: ''; width: 32px; height: 1px;
            background: var(--plum-soft); display: inline-block;
        }

        .hero h1 {
            font-family: 'Fraunces', serif;
            font-size: clamp(5rem, 18vw, 14rem);
            font-weight: 300; line-height: 0.9;
            letter-spacing: -0.04em;
            color: var(--plum-bright);
            margin-bottom: 1rem;
            font-variation-settings: 'opsz' 144, 'SOFT' 100;
            text-shadow: 0 0 120px var(--glow);
        }
        .hero h1 em {
            font-style: italic;
            font-weight: 300;
            color: var(--violet-soft);
            letter-spacing: -0.05em;
        }

        .hero .sub {
            font-size: 1.05rem;
            color: var(--ink-soft);
            line-height: 1.7;
            font-weight: 300;
            max-width: 560px;
            margin: 0 auto;
        }

        /* ================= TABS ================= */
        .tabs {
            max-width: 1400px;
            margin: 3rem auto 0;
            padding: 0 2.5rem;
            display: flex;
            gap: 2.5rem;
            border-bottom: 1px solid var(--line);
            width: 100%;
            position: relative;
            z-index: 5;
        }

        .tab {
            background: none; border: none;
            color: var(--dim);
            font-family: 'Inter', sans-serif;
            font-size: 0.78rem;
            font-weight: 500;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            padding: 1.2rem 0;
            cursor: pointer;
            position: relative;
            transition: color 0.3s ease;
            display: inline-flex;
            align-items: center;
            gap: 0.6rem;
        }

        .tab::after {
            content: '';
            position: absolute;
            bottom: -1px; left: 0; right: 0;
            height: 1px;
            background: var(--plum-soft);
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.4s cubic-bezier(0.2, 0, 0, 1);
        }

        .tab:hover { color: var(--ink-soft); }
        .tab.active { color: var(--ink); }
        .tab.active::after { transform: scaleX(1); }

        .tab .tab-dot {
            width: 6px; height: 6px; border-radius: 50%;
            background: var(--dim-soft);
            transition: background 0.3s ease, box-shadow 0.3s ease;
        }
        .tab.active .tab-dot {
            background: var(--plum-soft);
            box-shadow: 0 0 12px var(--glow);
        }

        /* ================= КОНТЕНТ ================= */
        .content {
            max-width: 1400px;
            margin: 0 auto;
            padding: 3rem 2.5rem 5rem;
            flex: 1;
            width: 100%;
            position: relative;
            z-index: 5;
        }

        /* ================= ПОСТЫ ================= */
        .posts {
            display: flex;
            flex-direction: column;
            gap: 2rem;
            max-width: 820px;
            margin: 0 auto;
        }

        .post {
            padding: 2.2rem 2.4rem;
            border-radius: 4px;
            background: rgba(10, 16, 36, 0.72);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--line);
            border-left: 3px solid var(--plum);
            transition: border-color 0.4s ease, background 0.4s ease;
        }

        .post:hover {
            border-color: var(--line-strong);
            border-left-color: var(--plum-soft);
        }

        .post h3 {
            font-family: 'Fraunces', serif;
            font-size: 1.9rem;
            font-weight: 400;
            letter-spacing: -0.02em;
            line-height: 1.15;
            margin-bottom: 0.5rem;
            color: var(--ink);
            font-variation-settings: 'opsz' 144;
        }

        .post .date {
            font-size: 0.68rem;
            letter-spacing: 0.3em;
            text-transform: uppercase;
            color: var(--plum-soft);
            display: block;
            margin-bottom: 1.5rem;
            font-weight: 500;
        }

        .post img {
            max-width: 100%;
            border-radius: 3px;
            margin: 1rem 0;
            display: block;
            border: 1px solid var(--line);
        }

        .post .text {
            color: var(--ink-soft);
            font-size: 1.02rem;
            line-height: 1.75;
            white-space: pre-wrap;
            word-wrap: break-word;
            font-weight: 300;
        }

        /* ================= КОММЕНТАРИИ ================= */
        .comments-section {
            margin-top: 2rem;
            padding-top: 2rem;
            border-top: 1px solid var(--line);
        }

        .comments-title {
            color: var(--dim);
            font-size: 0.68rem;
            text-transform: uppercase;
            letter-spacing: 0.3em;
            margin-bottom: 1.2rem;
            font-weight: 500;
        }

        .comments-list {
            display: flex;
            flex-direction: column;
            gap: 1rem;
            margin-bottom: 1.2rem;
        }

        .comment {
            padding: 1rem 1.2rem;
            border-radius: 3px;
            background: rgba(176, 136, 176, 0.06);
            border-left: 2px solid var(--plum);
        }

        .comment-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.4rem;
            font-size: 0.82rem;
            gap: 0.5rem;
        }

        .comment-author {
            color: var(--plum-soft);
            font-weight: 500;
        }

        .comment-date {
            color: var(--dim);
            font-size: 0.72rem;
        }

        .comment-text {
            color: var(--ink-soft);
            font-size: 0.94rem;
            line-height: 1.6;
        }

        .comment-delete {
            background: none;
            border: none;
            color: var(--dim);
            cursor: pointer;
            font-size: 0.72rem;
            margin-left: 8px;
            font-family: inherit;
            transition: color 0.2s;
        }
        .comment-delete:hover { color: var(--rose); }

        .comment-form {
            display: flex;
            flex-direction: column;
            gap: 0.7rem;
        }

        .comment-form textarea {
            background: rgba(10, 16, 36, 0.6);
            border: 1px solid var(--line);
            border-radius: 3px;
            padding: 12px 16px;
            color: var(--ink);
            font-family: inherit;
            font-size: 0.94rem;
            resize: vertical;
            min-height: 60px;
            transition: border-color 0.25s;
            font-weight: 300;
        }

        .comment-form textarea:focus {
            outline: none;
            border-color: var(--plum-soft);
            box-shadow: 0 0 0 3px rgba(176, 136, 176, 0.08);
        }

        .comment-form textarea::placeholder { color: var(--dim-soft); }

        .comment-form button {
            align-self: flex-end;
            background: transparent;
            color: var(--plum-soft);
            border: 1px solid var(--plum-soft);
            padding: 10px 24px;
            border-radius: 3px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            font-size: 0.78rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            transition: all 0.3s;
        }

        .comment-form button:hover {
            background: var(--plum-soft);
            color: var(--sky);
        }

        .comment-form button:disabled { opacity: 0.4; cursor: not-allowed; }

        .comment-login-msg {
            color: var(--dim);
            font-size: 0.85rem;
            font-style: italic;
            padding: 1rem;
            text-align: center;
            border: 1px dashed var(--line-strong);
            border-radius: 3px;
        }

        .comment-login-msg a {
            color: var(--plum-soft);
            text-decoration: none;
            font-style: normal;
            font-weight: 500;
            cursor: pointer;
        }
        .comment-login-msg a:hover { text-decoration: underline; }

        /* ================= СООБЩЕНИЯ ================= */
        .messages-empty {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            text-align: center;
            color: var(--dim);
            padding: 6rem 2rem;
            max-width: 500px;
            margin: 0 auto;
        }

        .messages-empty .big-icon {
            font-size: 3rem;
            margin-bottom: 1.5rem;
            opacity: 0.5;
            color: var(--plum-soft);
        }

        .messages-empty h3 {
            font-family: 'Fraunces', serif;
            color: var(--ink);
            font-size: 1.8rem;
            margin-bottom: 0.8rem;
            font-weight: 400;
            letter-spacing: -0.02em;
            font-variation-settings: 'opsz' 144;
        }

        .messages-empty p {
            font-size: 0.98rem;
            line-height: 1.7;
            color: var(--dim);
        }

        /* ================= СОСТОЯНИЯ ================= */
        .state-msg {
            text-align: center;
            color: var(--dim);
            padding: 4rem 1rem;
            font-size: 0.95rem;
        }
        .state-msg.error { color: var(--rose); }

        /* ================= USER BADGE (в правом верхнем углу) ================= */
        .user-badge {
            position: fixed;
            top: 60px;
            right: 24px;
            z-index: 50;
            display: flex;
            align-items: center;
            gap: 0.7rem;
            padding: 0.55rem 1rem 0.55rem 0.6rem;
            background: rgba(10, 16, 36, 0.85);
            backdrop-filter: blur(14px);
            -webkit-backdrop-filter: blur(14px);
            border: 1px solid var(--line);
            border-radius: 30px;
            font-size: 0.8rem;
            color: var(--ink-soft);
            cursor: pointer;
            transition: all 0.3s;
        }

        .user-badge:hover {
            border-color: var(--plum-soft);
            background: rgba(10, 16, 36, 0.95);
        }

        .user-badge .avatar {
            width: 28px; height: 28px;
            border-radius: 50%;
            background: linear-gradient(135deg, var(--plum), var(--violet));
            display: flex;
            align-items: center;
            justify-content: center;
            color: #fff;
            font-weight: 600;
            font-size: 0.75rem;
            font-family: 'Fraunces', serif;
        }

        .user-badge .name {
            max-width: 120px;
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        /* ================= FOOTER ================= */
        .footer {
            max-width: 1400px;
            margin: 0 auto;
            padding: 5rem 2.5rem 3rem;
            display: flex; justify-content: space-between;
            align-items: center; flex-wrap: wrap; gap: 1.5rem;
            font-size: 0.7rem; letter-spacing: 0.3em;
            text-transform: uppercase; color: var(--dim);
            border-top: 1px solid var(--line);
            position: relative; z-index: 5;
            width: 100%;
        }
        .footer a { color: var(--dim); text-decoration: none; transition: color 0.3s ease; }
        .footer a:hover { color: var(--plum-soft); }
        .footer .links { display: flex; gap: 2.5rem; }

        /* ================= МОДАЛЬНОЕ ОКНО ================= */
        #auth-modal {
            display: none;
            position: fixed;
            inset: 0;
            background: rgba(10, 16, 36, 0.85);
            z-index: 9999;
            align-items: center;
            justify-content: center;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            padding: 1rem;
        }
        #auth-modal.open { display: flex; }

        .auth-modal-content {
            background: rgba(14, 22, 48, 0.98);
            border: 1px solid rgba(176, 136, 176, 0.25);
            border-radius: 4px;
            padding: 2.5rem;
            width: 100%;
            max-width: 420px;
            position: relative;
            box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5), 0 0 80px var(--glow);
        }

        .auth-modal-content h2 {
            font-family: 'Fraunces', serif;
            color: var(--ink);
            margin-bottom: 2rem;
            font-size: 1.8rem;
            text-align: center;
            font-weight: 400;
            font-style: italic;
            letter-spacing: -0.02em;
        }

        .auth-modal-close {
            position: absolute;
            top: 14px; right: 18px;
            background: none; border: none;
            color: var(--dim); font-size: 1.5rem;
            cursor: pointer; line-height: 1;
            transition: color 0.2s;
        }
        .auth-modal-close:hover { color: var(--ink); }

        .auth-form input {
            width: 100%;
            padding: 13px 16px;
            margin-bottom: 0.8rem;
            background: rgba(10, 16, 36, 0.6);
            border: 1px solid var(--line);
            border-radius: 3px;
            color: var(--ink);
            font-family: inherit;
            font-size: 0.95rem;
            transition: all 0.25s;
            font-weight: 300;
        }
        .auth-form input:focus {
            outline: none;
            border-color: var(--plum-soft);
            box-shadow: 0 0 0 3px rgba(176, 136, 176, 0.1);
        }
        .auth-form input::placeholder { color: var(--dim-soft); }

        .auth-form button {
            width: 100%;
            padding: 13px;
            background: transparent;
            color: var(--plum-soft);
            border: 1px solid var(--plum-soft);
            border-radius: 3px;
            cursor: pointer;
            font-family: inherit;
            font-weight: 500;
            font-size: 0.82rem;
            letter-spacing: 0.25em;
            text-transform: uppercase;
            transition: all 0.3s;
            margin-top: 0.5rem;
        }
        .auth-form button:hover {
            background: var(--plum-soft);
            color: var(--sky);
        }
        .auth-form button:disabled { opacity: 0.5; }

        .auth-switch {
            text-align: center;
            margin-top: 1.2rem;
            color: var(--dim);
            cursor: pointer;
            font-size: 0.85rem;
            background: none; border: none;
            font-family: inherit;
            width: 100%;
            transition: color 0.2s;
        }
        .auth-switch:hover { color: var(--plum-soft); }

        .auth-error {
            color: var(--rose);
            font-size: 0.82rem;
            margin-bottom: 0.7rem;
            text-align: center;
            min-height: 1.1em;
        }

        /* ================= АДАПТИВ ================= */
        @media (max-width: 640px) {
            .top-bar { padding: 0.6rem 0.8rem; font-size: 0.58rem; letter-spacing: 0.25em; }
            .top-bar .sep { margin: 0 0.5rem; }

            .hero { padding: 4rem 1.5rem 2rem; }
            .hero .eyebrow { margin-bottom: 1rem; font-size: 0.6rem; }
            .hero .eyebrow::before, .hero .eyebrow::after { width: 20px; }
            .hero h1 { font-size: 5rem; margin-bottom: 0.8rem; }
            .hero .sub { font-size: 0.95rem; }

            .tabs { padding: 0 1.5rem; gap: 1.5rem; margin-top: 2rem; }
            .tab { font-size: 0.7rem; padding: 1rem 0; }

            .content { padding: 2rem 1.5rem 3rem; }
            .post { padding: 1.6rem 1.5rem; }
            .post h3 { font-size: 1.5rem; }

            .user-badge {
                top: 52px;
                right: 12px;
                font-size: 0.72rem;
                padding: 0.4rem 0.8rem 0.4rem 0.4rem;
            }
            .user-badge .avatar { width: 24px; height: 24px; font-size: 0.7rem; }
            .user-badge .name { max-width: 80px; }

            .footer {
                flex-direction: column;
                align-items: flex-start;
                padding: 3rem 1.5rem 2rem;
            }
        }
    </style>
</head>
<body>

    <div class="page">

        <div class="top-bar">
            <a href="index.html">← На главную</a>
            <span class="sep">·</span>
            IFY
            <span class="sep">·</span>
            Project 01
        </div>

        <!-- Кнопка пользователя -->
        <div class="user-badge" id="user-badge" onclick="handleUserClick()">
            <div class="avatar" id="user-avatar">?</div>
            <div class="name" id="user-name">Войти</div>
        </div>

        <!-- Hero -->
        <section class="hero">
            <div class="eyebrow">Новая глава · Проект 01</div>
            <h1>I<em>FY</em></h1>
            <p class="sub">
                I Forever Young. Пространство для своих. 
                Канал с постами, личные сообщения — всё в одном месте.
            </p>
        </section>

        <!-- Табы -->
        <nav class="tabs">
            <button class="tab active" data-tab="channel" onclick="switchTab('channel')">

            </button>
            <button class="tab" data-tab="messages" onclick="switchTab('messages')">
                <span class="tab-dot"></span>Сообщения
            </button>
        </nav>

        <!-- Контент -->
        <section class="content" id="content">
            <div class="posts" id="posts-container">
                <p class="state-msg">Загрузка...</p>
            </div>
        </section>

        <footer class="footer">
            <div>© 2026 · IFY · I Forever Young</div>
            <div class="links">
                <a href="https://vk.ru/snl68" target="_blank">VK</a>
                <a href="https://t.me/t_cnp" target="_blank">Telegram</a>
            </div>

    <!-- МОДАЛЬНОЕ ОКНО -->
    <div id="auth-modal">
        <div class="auth-modal-content">
            <button class="auth-modal-close" onclick="closeAuthModal()">×</button>
            <h2 id="auth-title">Вход</h2>
            <form class="auth-form" onsubmit="handleAuthSubmit(event)">
                <input type="hidden" id="auth-mode" value="login" />
                <div id="auth-username-row" style="display:none;">
                    <input type="text" id="auth-username" placeholder="Ваше имя" maxlength="30" />
                </div>
                <input type="email" id="auth-email" placeholder="Email" required />

                Нет аккаунта? Зарегистрироваться
            </button>

    <!-- Звёздное небо -->
    <script>
    (function() {
        'use strict';
        function createStarfield() {
            const field = document.createElement('div');
            field.className = 'starfield';
            const count = window.innerWidth < 640 ? 140 : 260;
            const configs = [
                { prob: 0.55, min: 0.5, max: 1.0, colors: ['c-white'], size: 's-1', speed: 't-1' },
                { prob: 0.20, min: 0.9, max: 1.4, colors: ['c-white','c-blue'], size: 's-2', speed: 't-2' },
                { prob: 0.15, min: 1.1, max: 1.8, colors: ['c-gold','c-warm','c-white'], size: 's-2', speed: 't-2' },
                { prob: 0.07, min: 1.8, max: 2.4, colors: ['c-white','c-blue'], size: 's-3', speed: 't-3' },
                { prob: 0.03, min: 2.4, max: 3.2, colors: ['c-warm','c-gold','c-pink'], size: 's-4', speed: 't-1' }
            ];
            function pickConfig() {
                const r = Math.random(); let acc = 0;
                for (const c of configs) { acc += c.prob; if (r < acc) return c; }
                return configs[0];
            }
            for (let i = 0; i < count; i++) {
                const cfg = pickConfig();
                const star = document.createElement('div');
                star.className = 'star ' + cfg.size + ' ' + cfg.speed;
                star.classList.add(cfg.colors[Math.floor(Math.random() * cfg.colors.length)]);
                const size = cfg.min + Math.random() * (cfg.max - cfg.min);
                star.style.width = size + 'px';
                star.style.height = size + 'px';
                star.style.left = Math.random() * 100 + '%';
                star.style.top = Math.random() * 100 + '%';
                star.style.animationDelay = (Math.random() * 6) + 's';
                field.appendChild(star);
            }
            document.body.insertBefore(field, document.body.firstChild);
        }
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', createStarfield);
        } else { createStarfield(); }
    })();
    </script>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="supabase-client.js"></script>
    <script src="auth.js"></script>

    <script>
        function escapeHtml(str) {
            if (str === null || str === undefined) return '';
            const div = document.createElement('div');
            div.textContent = String(str);
            return div.innerHTML;
        }

        // ================= ВКЛАДКИ =================
        function switchTab(tab) {
            document.querySelectorAll('.tab').forEach(el => {
                el.classList.toggle('active', el.dataset.tab === tab);
            });

            const content = document.getElementById('content');

            if (tab === 'channel') {
                content.innerHTML = '<div class="posts" id="posts-container"><p class="state-msg">Загрузка...</p></div>';
                loadPosts();
            } else if (tab === 'messages') {
                content.innerHTML = `
                    <div class="messages-empty">
                        <div class="big-icon">✦</div>
                        <h3>Скоро здесь будет тепло</h3>
                        <p>Мы работаем над системой личных сообщений. Возвращайся позже — тут появится что-то важное.</p>
                    </div>
                `;
            }
        }

        // ================= ПОСТЫ =================
        async function loadPosts() {
            const container = document.getElementById('posts-container');
            if (!container) return;

            container.innerHTML = '<p class="state-msg">Загрузка...</p>';

            try {
                const { data, error } = await db
                    .from('posts')
                    .select('*')
                    .order('date', { ascending: false });

                if (error) throw error;

                container.innerHTML = '';

                if (!data || data.length === 0) {
                    container.innerHTML = '<p class="state-msg">Пока нет постов. Скоро появятся.</p>';
                    return;
                }

                data.forEach(post => {
                    const div = document.createElement('div');
                    div.className = 'post';
                    div.innerHTML = `
                        <h3>${escapeHtml(post.title)}</h3>
                        <span class="date">${escapeHtml(post.date || '')}</span>
                        ${post.image_url ? `<img src="${escapeHtml(post.image_url)}" alt="${escapeHtml(post.title)}" loading="lazy" />` : ''}
                        <div class="text">${escapeHtml(post.text)}</div>
                        <div class="comments-section">
                            <div class="comments-title">Комментарии</div>
                            <div class="comments-list" id="comments-${post.id}">
                                <p class="state-msg">Загрузка...</p>
                            </div>
                            <div id="comment-form-${post.id}"></div>
                        </div>
                    `;
                    container.appendChild(div);
                });

                data.forEach(post => loadCommentsForPost(post.id));

            } catch (err) {
                console.error('Ошибка загрузки постов:', err);
                container.innerHTML = '<p class="state-msg error">Не удалось загрузить посты.</p>';
            }
        }

        // ================= КОММЕНТАРИИ =================
        async function loadCommentsForPost(postId) {
            const list = document.getElementById(`comments-${postId}`);
            if (!list) return;

            const { data, error } = await db
                .from('comments')
                .select('*')
                .eq('post_id', postId)
                .order('created_at', { ascending: true });

            if (error) {
                list.innerHTML = '<p class="state-msg error">Ошибка загрузки</p>';
                return;
            }

            if (!data || data.length === 0) {
                list.innerHTML = '<p style="color:var(--dim); font-size:0.85rem; text-align:center; padding:0.4rem;">Пока нет комментариев — будь первым ✦</p>';
            } else {
                list.innerHTML = data.map(c => renderComment(c)).join('');
            }

            renderCommentForm(postId);
        }

        function renderComment(c) {
            const isMine = currentUser && currentUser.id === c.user_id;
            const deleteBtn = isMine
                ? `<button class="comment-delete" onclick="deleteComment(${c.id}, ${c.post_id})">удалить</button>`
                : '';
            return `
                <div class="comment">
                    <div class="comment-header">
                        <span class="comment-author">${escapeHtml(c.author_name)}</span>
                        <span>
                            <span class="comment-date">${new Date(c.created_at).toLocaleString('ru-RU')}</span>
                            ${deleteBtn}
                        </span>
                    </div>
                    <div class="comment-text">${escapeHtml(c.text)}</div>
                </div>
            `;
        }

        function renderCommentForm(postId) {
            const formBox = document.getElementById(`comment-form-${postId}`);
            if (!formBox) return;

            if (!currentUser) {
                formBox.innerHTML = `
                    <p class="comment-login-msg">
                        <a onclick="openAuthModal()">Войдите</a>, чтобы оставить комментарий
                    </p>
                `;
                return;
            }

            formBox.innerHTML = `
                <form class="comment-form" onsubmit="submitComment(event, ${postId})">
                    <textarea id="comment-text-${postId}" placeholder="Напишите что-нибудь тёплое..." maxlength="500" required></textarea>
                    <button type="submit" id="comment-btn-${postId}">Отправить</button>
                </form>
            `;
        }

        async function submitComment(event, postId) {
            event.preventDefault();
            const textarea = document.getElementById(`comment-text-${postId}`);
            const btn = document.getElementById(`comment-btn-${postId}`);
            const text = textarea.value.trim();
            if (!text) return;

            btn.disabled = true;
            btn.textContent = 'Отправка...';

            try {
                const { error } = await db.from('comments').insert({
                    post_id: postId,
                    user_id: currentUser.id,
                    author_name: currentProfile?.username || currentUser.email.split('@')[0],
                    text: text
                });
                if (error) throw error;
                textarea.value = '';
                await loadCommentsForPost(postId);
            } catch (err) {
                alert('Ошибка: ' + err.message);
            } finally {
                btn.disabled = false;
                btn.textContent = 'Отправить';
            }
        }

        async function deleteComment(commentId, postId) {
            if (!confirm('Удалить комментарий?')) return;
            const { error } = await db.from('comments').delete().eq('id', commentId);
            if (error) { alert('Ошибка: ' + error.message); return; }
            await loadCommentsForPost(postId);
        }

        function handleUserClick() {
            if (currentUser) {
                if (confirm('Выйти из аккаунта?')) logout();
            } else {
                openAuthModal();
            }
        }

        // Обновляем UI после смены авторизации
        const originalUpdateAuthUI = window.updateAuthUI;
        window.updateAuthUI = function() {
            if (originalUpdateAuthUI) originalUpdateAuthUI();

            const badge = document.getElementById('user-badge');
            const nameEl = document.getElementById('user-name');
            const avatarEl = document.getElementById('user-avatar');

            if (!badge) return;

            if (currentUser) {
                const name = currentProfile?.username || currentUser.email.split('@')[0];
                nameEl.textContent = name;
                avatarEl.textContent = name.charAt(0).toUpperCase();
            } else {
                nameEl.textContent = 'Войти';
                avatarEl.textContent = '?';
            }
        };

        // ================= ЗАПУСК =================
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', loadPosts);
        } else {
            loadPosts();
        }
    </script>

</body>
